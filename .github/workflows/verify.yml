name: verify

# 팩은 배포물이다. 서비스 릴리즈가 아니라 **팩 변경 자체**가 검증을 트리거한다.
# 이 워크플로가 없으면 apm.yml 의 선언(호스트 능력·발행 여부)은 다시 "아무도 읽지 않는
# 산문"으로 돌아간다 — 그게 어휘 드리프트를 만든 원인이었다.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install --quiet pyyaml

      - name: lint (어휘 · 필수 필드 · 테넌트 정체성)
        run: python3 kit/apm_kit.py lint

      # 두 호스트 모두 확인한다. local-byo 실패는 **정보**이지 CI 실패가 아니다 —
      # 어떤 팩이 왜 로컬에서 못 도는지가 로컬 실행 로드맵 그 자체다.
      - name: check — agent-hub (Cloud)
        run: python3 kit/apm_kit.py check --host agent-hub

      - name: check — local-byo (정보용, 실패 허용)
        continue-on-error: true
        run: python3 kit/apm_kit.py check --host local-byo

      - name: build (.apm 아티팩트)
        run: PYTHONPATH=kit python3 kit/apm_kit.py build

      # 결정성은 content-hash 가 주소라는 계약의 전제다. 같은 입력이 두 번 다른
      # 바이트를 내면 dedup 도 무결성 검증도 전부 무의미해진다.
      - name: 결정성 검증 (재빌드 == 동일 바이트)
        run: |
          find dist -name '*.apm' -exec shasum -a 256 {} \; | sort > /tmp/first.txt
          rm -rf dist
          PYTHONPATH=kit python3 kit/apm_kit.py build >/dev/null
          find dist -name '*.apm' -exec shasum -a 256 {} \; | sort > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt && echo "DETERMINISTIC ✓"

      - name: marketplace.json 이 최신인지 (커밋 누락 방지)
        run: |
          python3 kit/apm_kit.py market
          git diff --exit-code .claude-plugin/marketplace.json \
            || (echo "::error::marketplace.json is stale — run 'python3 kit/apm_kit.py market' and commit"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: apm-artifacts
          path: dist/*.apm
          retention-days: 14
