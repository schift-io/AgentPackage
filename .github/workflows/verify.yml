name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install --quiet pyyaml

      - name: lint examples
        run: python3 kit/apm_kit.py lint --packs-dir examples

      - name: unit tests
        run: python3 -m unittest discover -s tests -v

      - name: check — agent-hub
        run: python3 kit/apm_kit.py check --host agent-hub --packs-dir examples

      - name: check — local-byo (informational)
        continue-on-error: true
        run: python3 kit/apm_kit.py check --host local-byo --packs-dir examples

      - name: build
        run: python3 kit/apm_kit.py build --packs-dir examples --out dist

      - name: determinism (rebuild == same bytes)
        run: |
          find dist -name '*.apm' -exec shasum -a 256 {} \; | sort > /tmp/first.txt
          rm -rf dist
          python3 kit/apm_kit.py build --packs-dir examples --out dist >/dev/null
          find dist -name '*.apm' -exec shasum -a 256 {} \; | sort > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt && echo "DETERMINISTIC ✓"

      - uses: actions/upload-artifact@v4
        with:
          name: apm-artifacts
          path: dist/*.apm
          retention-days: 14
