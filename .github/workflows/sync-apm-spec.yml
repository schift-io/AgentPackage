name: sync-apm-spec

# 이 repo → schift-io/apm-spec **단방향** 복사. 정본은 여기이고 저쪽은 파생이다.
# 저쪽에서 고치면 다음 sync 에 덮여 사라진다.
#
# ⚠️ **자동 실행은 아직 켜지 않는다.** `SYNC_TOKEN` 시크릿이 이 repo 에 없다
# (실측 2026-08-10: repo·org 시크릿 0건). 시크릿을 넣기 전에 push 트리거를 켜면
# 매 push 마다 빨간 워크플로가 쌓이고, 그러면 "빨간 건 원래 그런 것"이 되어
# 진짜 실패를 못 본다. 시크릿을 넣은 뒤 아래 `push:` 주석을 푼다.
#
# 무엇이 나가고 무엇이 안 나가는가 — 나가는 것만 명시적으로 복사한다(deny-list 가
# 아니라 allow-list. 새 파일이 실수로 따라 나가지 않게).
#   나간다:   SPEC.md · LICENSE · kit/{apm_codec.py,apm_kit.py,capabilities.json}
#             examples/** · mirror/README.md → README.md · mirror/gitignore → .gitignore
#   안 나간다: identity-patterns.json(정체성 문자열 자체) · kit/publish.py(사내 발행
#             인프라, 포맷 아님) · packs/** (자사 팩 24개) · dist/** · .github/**

on:
  # push:
  #   branches: [master, main]
  #   paths: ["SPEC.md", "LICENSE", "kit/**", "examples/**", "mirror/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 스테이징 조립 (allow-list)
        run: |
          set -euo pipefail
          mkdir -p out/kit
          cp SPEC.md LICENSE out/
          cp mirror/README.md out/README.md
          cp mirror/gitignore out/.gitignore
          cp kit/apm_codec.py kit/apm_kit.py kit/capabilities.json out/kit/
          cp -R examples out/examples
          find out -name __pycache__ -type d -prune -exec rm -rf {} +

      # 정체성 게이트를 미러 자신에게도 건다. 팩 안 .md/.yml 만 보는 lint 로는
      # SPEC 본문·README·경로명·저자 메타가 안 잡힌다 — 2026-08-10 에 같은 실수를
      # 네 번(소스 하드코딩 / kit/ 안 배치 / SPEC 본문 복사 / 커밋 저자 메일) 했다.
      - name: 정체성 잔존 검사 (fail-closed)
        run: |
          set -euo pipefail
          if [ ! -f identity-patterns.json ]; then
            echo "identity-patterns.json 이 없다 — 검사할 패턴이 없으면 미러하지 않는다."
            exit 1
          fi
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          patterns = json.loads(Path("identity-patterns.json").read_text(encoding="utf-8"))["patterns"]
          hits = []
          for path in sorted(Path("out").rglob("*")):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for entry in patterns:
                  if re.search(entry["pattern"], text):
                      hits.append(f"{path}: {entry['label']}")
                  # 파일명·경로에도 건다. 내용만 보면 배치가 사각지대다.
                  if re.search(entry["pattern"], str(path)):
                      hits.append(f"{path} (경로): {entry['label']}")
          if hits:
              print("정체성 잔존 — 미러 중단:")
              for hit in hits:
                  print(f"  ✗ {hit}")
              sys.exit(1)
          print(f"✓ 정체성 0건 ({len(patterns)} 패턴 × out/ 전 파일)")
          PY

      - name: kit 이 자립적으로 도는지 (packs 없이)
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          cd out
          python3 kit/apm_kit.py lint higgsfield-demo.agent --packs-dir examples
          # local-byo 에서는 거절되는 것이 정상 — exit 1 을 기대한다.
          if python3 kit/apm_kit.py check higgsfield-demo.agent --host local-byo --packs-dir examples; then
            echo "예시 팩이 local-byo 에서 통과했다 — fail-closed 시연이 깨졌다."
            exit 1
          fi
          python3 kit/apm_kit.py check higgsfield-demo.agent --host agent-hub --packs-dir examples
          python3 kit/apm_kit.py build higgsfield-demo.agent --packs-dir examples --out /tmp/apm-out

      - name: apm-spec 으로 밀기
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SYNC_TOKEN }}
          external_repository: schift-io/apm-spec
          publish_branch: main
          publish_dir: ./out
          destination_dir: .
          user_name: Schift
          user_email: hello@schift.io
          commit_message: "sync from AgentPackage@${{ github.sha }}"
