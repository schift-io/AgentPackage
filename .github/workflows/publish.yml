name: publish

# 팩 변경 자체가 발행을 트리거한다. 발행이 agent-hub 배포에만 붙어 있어서 팩만
# 고치고 서비스를 배포하지 않으면 레지스트리가 썩었다 — 2026-07-20 실측으로
# **6일 방치**돼 있었고 그 사이 prod 의 image-gen 은 폐기된 taxonomy 를 가리켰다.
#
# ⚠️ **이 워크플로는 발행 주체가 아니다. 앞으로도 아니다.** 검증(lint + dry-run)만 한다.
#
# 이유였던 hash 불일치는 **2026-08-10 에 해소됐다**. 원인은 kit 의 build 가 apm.yml 만
# 읽고 SPEC §5 의 정본 판정 순서(pack.json 우선)를 건너뛴 것이었고, 고치자 agent-hub 와
# 36/36 일치했다(고치기 전 8/8 불일치. 옛 실측 zodal@0.1.4 kit 4e675c7eec05 /
# agent-hub a38ae237b866 은 그 시절 값이다).
#
# 발행 주체는 **모노레포의 `./deploy.sh apm-packs`** 로 확정한다(2026-08-10 오너 결정).
# 이 워크플로가 아닌 이유는 자격증명이 아니라 **여기 `packs/` 가 라이브가 아니기
# 때문**이다 — 실측: 이 repo 27개 vs 라이브(agent-hub `apm/`) 36개, 9개는 아예 없고
# 표본 5개가 전부 3 patch 뒤처져 있다(accounting 0.1.5 vs 0.1.8, zodal 0.1.5 vs 0.1.9,
# image-gen 0.2.3 vs 0.2.6, reels 0.1.3 vs 0.1.6, blog 0.1.5 vs 0.1.8).
# 여기서 발행하면 **구버전을 프로드에 덮어쓴다.** hash 가 맞는 것과 내용이 최신인
# 것은 다른 문제이고, 앞의 것만 고쳤다.
#
# ⚠️ 그래서 `packs/` 는 lint 대상으로만 남는다 — 이 CI 의 초록은 "라이브가 건강하다"가
# 아니라 "이 사본이 문법적으로 온전하다"는 뜻이다. 착각하지 말 것.

on:
  push:
    branches: [master, main]
    paths: ["packs/**", "kit/**"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install --quiet pyyaml boto3

      # 발행 전 게이트 — 어휘·필수 필드·테넌트 정체성이 깨진 팩은 올리지 않는다.
      - name: lint
        run: python3 kit/apm_kit.py lint

      - name: dry-run (빌드 + hash 산출, 쓰지 않음)
        env:
          APM_PUBLISH_DRY_RUN: "1"
        run: python3 kit/publish.py

      # 라이브 발행 스텝은 **의도적으로 없다**(위 주석). 발행은 모노레포에서
      # `./deploy.sh apm-packs` 로 한다. 여기에 되살리면 구버전 덮어쓰기가 난다.
