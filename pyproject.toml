[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apm-kit"
version = "0.1.0"
description = "Build, validate, and seal AI agent packages (.apm)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Schift", email = "hello@schift.io"}]
keywords = ["ai", "agent", "package", "apm", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
apm-kit = "apm_kit.cli:main"

[project.urls]
Homepage = "https://github.com/schift-io/AgentPackage"
Documentation = "https://github.com/schift-io/AgentPackage/blob/main/SPEC.md"
Repository = "https://github.com/schift-io/AgentPackage"
Issues = "https://github.com/schift-io/AgentPackage/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/apm_kit"]
