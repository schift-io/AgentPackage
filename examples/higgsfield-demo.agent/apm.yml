name: higgsfield-demo
display_name: "Higgsfield Demo Agent"
version: 0.1.0
description: >-
  연출 전용 APM. 오픈 연출 버킷(higgsfield-directing)에서 샷 문법·광원·카메라워크·
  무브먼트·앵커 템플릿을 끌어와, txt2img로 스토리보드 grid 초안을 만들고 승인된
  패널만 imgs2vid로 짧게 클립화해 이어 붙인다. [txt2img] storyboard+movement [imgs2vid].
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다. visibility=발견 권한, 실행은 allowed_orgs 가
# 별도 게이트한다(apm_ref_visible / apm_ref_executable 분리) — public 이어도
# 실행은 계약 org 만.
visibility: public
owner_org: org_acme
# 선언적 pipeline. react = 에디터 루프 + 툴(RAG·txt2img·i2v), sub_agent_plan=[].
pipeline: react
# access_scope 미선언 — owner_org_id="" 로 취급된다.

knowledge:
  bucket_id: 00000000000000000000000000000000
  bucket_name: higgsfield-directing
  bucket_role: directing_reference
  retrieval_required: true

agents:
  - id: acme/higgsfield.agent/agent.md
    path: apm/higgsfield.agent/agent.md

skills:
  - id: acme/skills/higgsfield-director-brief
    path: apm/higgsfield.agent/skills/director-brief/SKILL.md
  - id: acme/skills/higgsfield-shot-list-designer
    path: apm/higgsfield.agent/skills/shot-list-designer/SKILL.md
    references:
      - apm/higgsfield.agent/skills/shot-list-designer/references/shot-grammar-extended.md
      - apm/higgsfield.agent/skills/shot-list-designer/references/lighting-camera-taxonomy.md
  - id: acme/skills/higgsfield-movement-composer
    path: apm/higgsfield.agent/skills/movement-composer/SKILL.md
    references:
      - apm/higgsfield.agent/skills/movement-composer/references/transition-library.md
  - id: acme/skills/higgsfield-prompt-composer
    path: apm/higgsfield.agent/skills/prompt-composer/SKILL.md
    references:
      - apm/higgsfield.agent/skills/prompt-composer/references/mega-anchor-variants.md
  - id: acme/skills/higgsfield-clip-stitch-planner
    path: apm/higgsfield.agent/skills/clip-stitch-planner/SKILL.md
    references:
      - apm/higgsfield.agent/skills/clip-stitch-planner/references/imgs2vid-constraints.md
  - id: acme/skills/higgsfield-director-qc
    path: apm/higgsfield.agent/skills/director-qc/SKILL.md
    references:
      - apm/higgsfield.agent/skills/director-qc/references/consistency-scorecard.md
  - id: acme/skills/schift-memory
    runtime: schift-memory

awp_operations:
  - id: higgsfield-directed-video
    contract_version: awp.higgsfield.directed_video.v1
    purpose: >-
      연출 브리프 + 샷 리스트 + 무브먼트로 승인 가능한 스토리보드·클립 패킷을 만든다.
      초안은 grid 1장(저비용)으로 뽑고, 승인된 패널만 imgs2vid로 클립화해 이어 붙인다.
    approval_required: true
    host_route: /v1/agents/higgsfield/operations/higgsfield-directed-video/runs
    image_model:                       # txt2img grid draft (Gemini 유지 — 가장 싼 Gemini 이미지)
      default: gemini-3.1-flash-lite-image   # 저가·고속 grid 1장 (~$0.034/1K)
      quality_upgrade: nano-banana
      cheapest_alt: flux-2-klein-9b
      adapter_env: HIGGSFIELD_TXT2IMG_ADAPTER_URL
      draft_mode: grid                 # 8~12 패널 1 forward pass
      per_image_token_estimate: 1120
    mcp:
      server: higgsfield
      transport: streamable_http
      url: https://mcp.higgsfield.ai/mcp
      discover_tools: true
      auth:
        type: oauth_bearer
        resource_metadata: https://mcp.higgsfield.ai/.well-known/oauth-protected-resource/mcp
        token_env: HIGGSFIELD_MCP_BEARER_TOKEN
    video_model:
      default: seedance_2_0
      cost_alt: kling3_0
      cost_alt2: minimax_hailuo
      quality_upgrade: veo3_1
      per_clip_sec_default: 5
      max_clip_sec: 6
    stitch_worker:
      binding: schift.higgsfield.ffmpeg-stitch.v1
      engine: ffmpeg
      job_route: /v1/sessions/{session_id}/higgsfield/stitch-jobs
      ffmpeg_role: concat_and_final_encode

runtime_boundary:
  apm_owns:
    - user_intent_routing
    - awp_selection
    - approval_summary
    - ambiguity_resolution
    - shot_axis_choice
    - panel_selection_choice
  awp_owns:
    - director_brief_schema
    - shot_list_schema
    - anchor_variant_policy
    - movement_transition_policy
    - grid_draft_composition
    - imgs2vid_clip_plan
    - stitch_order_policy
    - consistency_score_gate
    - usage_metering_events
  host_services_only:
    - auth
    - directing_bucket_rag
    - txt2img_connector          # Gemini grid (image_service) — 가장 싼 Gemini 이미지
    - higgsfield_mcp             # imgs2vid + character consistency + motion/style presets (Seedance 기본, 30+ 모델)
    - vision_scorer
    - stitch_worker
    - usage_ledger
    - run_persistence
  forbidden_host_policy:
    - brief_field_rewrite_prompt
    - shot_order_decision
    - anchor_text_policy
    - shot_grammar_policy
    - movement_policy
    - billing_metering_policy

tools:
  - name: generate_image
    description: >-
      Threads 파트용 이미지를 생성한다. args: prompt(필수), role?,
      size?(1536x1024 권장), ref_images?[]. 반환 JSON에 url이 포함된다.

document_hierarchy:
  template_id: "acme_higgsfield_v1"
  title: "연출 스토리보드·클립 패킷"
  kind: "document"
  knowledge:
    bucket_id: "00000000000000000000000000000000"
    bucket_name: "higgsfield-directing"
    bucket_role: "directing_reference"
    retrieval_required: true
    source_strategy: "directing_bucket_rag"
  sections:
    - id: "1"
      title: "연출 브리프"
      prompt: "의도·톤·레퍼런스·포맷/길이를 채운다. 모르는 값은 지어내지 말고 'MISSING — ask'로 표시해 ≤3개 질문으로 묶는다. 포맷(aspect_ratio)·길이(duration_sec) 없이 진행하지 않는다."
    - id: "2"
      title: "샷 리스트"
      prompt: "enum 샷 문법(카메라 앵글/사이즈) + 한 개의 motivated 광원 + 분위기로 샷을 나열한다. scene_beat(ESTABLISH/INCITE/REVEAL/ESCALATE/CLIMAX/RESOLVE/TRANSITION)을 쓰고 자유텍스트는 금지한다."
    - id: "3"
      title: "무브먼트"
      prompt: "각 컷에 camera_movement/subject_motion/motion_intensity/transition을 필수로 배치한다. 무브먼트는 imgs2vid 품질의 1급 시민이다."
    - id: "4"
      title: "프롬프트 · grid 초안"
      prompt: "MEGA-ANCHOR 변형 레시피로 매 컷 프롬프트 앞에 [환경][피사체][의상][분위기] 앵커를 concat하고, realism+negative(비디오 전용 포함)를 붙인다. 초안은 grid 1장으로 뽑고 승인 전에는 컷마다 개별 생성하지 않는다."
    - id: "5"
      title: "클립 · 스티치"
      prompt: "승인된 패널만 tools/list로 발견한 video tool에 전달한다. 기본 모델은 seedance_2_0이며 2~6초는 Schift 편집 가드레일이다. 실제 입력 스키마와 비용은 MCP discovery·provider preflight를 정본으로 삼고, 반환된 클립은 전환 순서대로 스티치한다."
    - id: "6"
      title: "QC / 사람 확인"
      prompt: "일관성 + 안전을 pre-render·pre-ship 두 번 채점하고 미달 컷만 앵커 보정 재생성한다. grid 생성·패널 확정·imgs2vid·stitch 전 샷 구성·앵커·클립 수·예상 원가를 사람이 승인한다."
artifacts:
  html_artifact_title: "연출 스토리보드·클립 패킷.html"
  markdown_artifact_title: "연출 스토리보드·클립 패킷.md"
  visual_assets_enabled: true
