name: room821-accounting-agent
display_name: "Room821 Accounting Agent"
version: 0.1.4
description: Room821 accounting (경리) agent package (베타). 경리 실무를 8개 variant로 소유 — 증빙→지출결의서, 거래내역→장부·세무·경영 리포트, 부가세 신고 준비, 원천세·급여, 매입→지급(미지급금), 미수금 관리, 근태·연차, 월마감·세무 캘린더. 회계 기준(적격증빙·계정과목·부가세 매입공제)에 맞춰 만들고, 신고·발행·지급·마감 자체는 홈택스/세무·노무 대리인/Bolta 핸드오프로 둔다.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: public
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=False)과 바이트 동일.
pipeline: fanout
access_scope: org  # owner_org_id=org_room821

knowledge:
  bucket_id: 647c1154c4494679ad345ef1f227f681
  bucket_name: accounting-kr-tax-reference
  bucket_role: accounting_reference
  retrieval_required: false

agents:
  - id: room821/accounting.agent/agent.md
    path: apm/accounting.agent/agent.md

skills:
  - id: room821/skills/expense-evidence
    path: apm/accounting.agent/skills/expense-evidence/SKILL.md
    references:
      - apm/accounting.agent/skills/expense-evidence/references/expense-form-fields.md
  - id: room821/skills/ledger-automation
    path: apm/accounting.agent/skills/ledger-automation/SKILL.md
    references:
      - apm/accounting.agent/skills/ledger-automation/references/ledger-pipeline.md
  - id: room821/skills/vat-filing
    path: apm/accounting.agent/skills/vat-filing/SKILL.md
    references:
      - apm/accounting.agent/skills/vat-filing/references/vat-return-fields.md
  - id: room821/skills/withholding-payroll
    path: apm/accounting.agent/skills/withholding-payroll/SKILL.md
    references:
      - apm/accounting.agent/skills/withholding-payroll/references/payroll-withholding-fields.md
  - id: room821/skills/payables-management
    path: apm/accounting.agent/skills/payables-management/SKILL.md
    references:
      - apm/accounting.agent/skills/payables-management/references/payables-fields.md
  - id: room821/skills/receivables-management
    path: apm/accounting.agent/skills/receivables-management/SKILL.md
    references:
      - apm/accounting.agent/skills/receivables-management/references/receivables-fields.md
  - id: room821/skills/attendance-leave
    path: apm/accounting.agent/skills/attendance-leave/SKILL.md
    references:
      - apm/accounting.agent/skills/attendance-leave/references/attendance-leave-fields.md
  - id: room821/skills/closing-checklist
    path: apm/accounting.agent/skills/closing-checklist/SKILL.md
    references:
      - apm/accounting.agent/skills/closing-checklist/references/closing-calendar.md
  - id: room821/skills/accounting-compute
    runtime: accounting-compute   # 결정적 계산 tool (부가세·원천징수·급여·aging). 제네릭 tool-runtime이 디스패치.
  - id: room821/skills/schift-memory
    runtime: schift-memory

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
default_variant: "expense"
document_hierarchy:
  template_id: "room821_accounting_expense_evidence_v1"
  title: "경리 증빙·지출 검토본"
  knowledge:
    bucket_id: "647c1154c4494679ad345ef1f227f681"
    bucket_name: "accounting-kr-tax-reference"
    bucket_role: "accounting_reference"
    retrieval_required: false
    retrieval_queries:
      - "지출유형 계정과목 분류 부가세 공제 불공제"
      - "적격증빙 법정지출증빙 세금계산서 현금영수증 3만원 가산세"
      - "현금영수증 매입세액 공제 가능 여부"
      - "기업업무추진비 접대비 부가세 불공제"
    retrieval_query_seeds:
      - "지출유형 계정과목 분류 부가세 공제 불공제"
      - "적격증빙 법정지출증빙 세금계산서 현금영수증 3만원 가산세"
      - "현금영수증 매입세액 공제 가능 여부"
      - "기업업무추진비 접대비 부가세 불공제"
  kind: "accounting"
  criteria_rule: "회계 기준(적격증빙·계정과목·부가세 매입공제)에 맞춰 결재용 지출결의서 초안을 만든다."
  criteria_keywords:
    - "지출결의서"
    - "증빙"
    - "계정과목"
    - "부가세"
    - "적격증빙"
  research_queries:
    - "적격증빙 법정지출증빙 세금계산서 계산서 신용카드매출전표 현금영수증 3만원"
    - "계정과목 분류 여비교통비 복리후생비 소모품비 지급수수료 기업업무추진비"
    - "부가세 매입세액 공제 불공제 접대비 비영업용 승용차 면세"
  sections:
    - id: "1"
      title: "지출 접수 요약"
      prompt: "요청 한 줄, 작성자/부서, 대상 기간, 첨부 증빙 파일명과 종류, 건수, 총액을 정리한다. 주입된 `source_document` 영수증을 하나도 빠짐없이 전부 나열하고(누락 금지), 건수는 실제 나열한 영수증 수와 일치시키며 총액은 각 영수증 합계의 산술합으로 검산해 제시한다."
    - id: "2"
      title: "계정과목·부가세 분류 (회계 기준)"
      prompt: "지출 건마다 계정과목, 적격증빙 여부, 부가세 매입세액 공제/불공제를 판단하고 근거를 붙인다. 애매하면 후보 2개와 [확인 필요]."
    - id: "3"
      title: "지출결의서 본문"
      prompt: "references/expense-form-fields.md 필드 명세대로 헤더·지출명세(행)·합계요약을 채운다. 원본에서 확인 안 되는 값은 [확인 필요]."
    - id: "4"
      title: "증빙 충족·누락"
      prompt: "증빙 첨부 목록을 만들고 적격/비적격을 나눈다. 3만 원 초과인데 적격증빙 없는 건, 금액·일자·공급처 충돌 건을 표시한다."
    - id: "5"
      title: "제출 전 검수"
      prompt: "전기/제출 전 사람이 확인할 항목(원본 대조, 가산세 위험, 계정 분류 적정성, 불공제 표시, 결재선)을 정리한다."
non_runnable_agent_ids:
  - "accounting-review-agent"
  - "attendance-review-agent"
  - "closing-review-agent"
  - "ledger-review-agent"
  - "payables-review-agent"
  - "receivables-review-agent"
  - "vat-review-agent"
  - "withholding-review-agent"
qc_enabled: true
sub_agent_plan:
  - id: "accounting-intake-agent"
    name: "Intake Agent"
    owns_sections:
      - "1"
    purpose: "요청과 첨부 증빙을 접수 단위로 정리한다."
    required_memory:
      - "document_hierarchy"
    output: "intake_and_attachments"
    generation:
      max_tokens: 3000
      temperature: 0.2
      timeout_seconds: 180
  - id: "accounting-classify-agent"
    name: "Account Classify Agent"
    owns_sections:
      - "2"
    purpose: "지출 건별로 계정과목·적격증빙·부가세 공제 여부를 회계 기준으로 판단한다."
    required_memory:
      - "document_hierarchy"
      - "intake_and_attachments"
      - "accounting_reference_bucket:647c1154c4494679ad345ef1f227f681"
    output: "account_classification"
    generation:
      max_tokens: 3200
      temperature: 0.1
      timeout_seconds: 200
  - id: "accounting-writer-agent"
    name: "Expense Writer Agent"
    owns_sections:
      - "3"
    purpose: "필드 명세대로 결재용 지출결의서 본문을 작성한다."
    required_memory:
      - "document_hierarchy"
      - "account_classification"
      - "expense_evidence_skill"
    output: "expense_report"
    generation:
      max_tokens: 4096
      temperature: 0.2
      timeout_seconds: 240
  - id: "accounting-evidence-agent"
    name: "Evidence Agent"
    owns_sections:
      - "4"
    purpose: "증빙 첨부 목록과 적격/비적격·누락·충돌을 정리한다."
    required_memory:
      - "document_hierarchy"
      - "account_classification"
      - "accounting_reference_bucket:647c1154c4494679ad345ef1f227f681"
    output: "evidence_checklist"
    generation:
      max_tokens: 3000
      temperature: 0.2
      timeout_seconds: 200
  - id: "accounting-review-agent"
    name: "Review Agent"
    owns_sections:
      - "5"
    purpose: "전기/제출 전 사람이 확인할 검수 항목을 남긴다."
    required_memory:
      - "document_hierarchy"
    output: "human_review"
    generation:
      max_tokens: 0
      temperature: 0.0
      timeout_seconds: 0
artifacts:
  html_artifact_title: "경리 증빙·지출 검토본.html"
  markdown_artifact_title: "경리 증빙·지출 검토본.md"
