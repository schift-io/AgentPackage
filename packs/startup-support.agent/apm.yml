name: schift-startup-support-agent
version: 0.1.0
description: K-Startup/기업마당/창업진흥원/중소벤처기업부 지원사업 공고와 사용자 회사 자료를 근거로, 오늘 지원할 사업 1건을 고정하고 마감 일정·사업계획서 초안을 만드는 지원사업 APM.
extends: ../runtime.yml
qc_enabled: true
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True지만 runnable
# sub-agent 10개도 있어 fan-out 유지, in-loop 툴 근거수집 W2b)과 바이트 동일.
pipeline: fanout
agents:
  - id: schift/startup-support.agent/agent.md
    path: apm/startup-support.agent/agent.md
skills:
  - id: schift/skills/startup-support-curator
    path: apm/startup-support.agent/skills/startup-support-curator/SKILL.md
    references:
      - apm/startup-support.agent/skills/startup-support-curator/references/business-plan-writing-playbook.md
      - apm/startup-support.agent/skills/startup-support-curator/references/submitted-plan-frontmatter-style.md
  - id: schift/skills/inject-current-date
    runtime: inject-current-date
  - id: room821/skills/lightocr-parser
    runtime: schift-ocr
  - id: room821/skills/schift-memory
    runtime: schift-memory
tools:
  - name: web_search
  - name: connected_source_search
  - name: connected_source_fetch
  - name: calendar_list_events
  - name: calendar_create_event
source_pack:
  id: k-startup-support
  fixture_path: resources/fixtures/startup-support
  source_registry: resources/fixtures/startup-support/sources.json
  supports_web_pages: true
  supports_uploaded_files: true
  file_support_note: website-crawler source-documents and local upload-folder script support pdf, hwpx, html, txt, and markdown. The current source-rag async adapter still crawls URLs only unless file artifacts are uploaded through the source-document path.
delivery:
  calendar:
    required: true
    tools:
      - calendar_list_events
      - calendar_create_event
    events:
      - application_deadline
      - briefing_session
      - draft_review
      - document_collection
      - submission_day
    approval_required: true
  telegram:
    required: true
    gateway: chat-gateway
    action_keys:
      - telegram.message.send
      - telegram.binding.upsert
      - telegram.session.upsert
    use_cases:
      - daily_digest
      - deadline_reminder
      - missing_documents
      - draft_review_request
    approval_required: true
  discord:
    required: true
    gateway: chat-gateway
    awp_block_kind: discord_message_send
    operation: schift.discord.message.send
    use_cases:
      - digest_channel
      - deadline_reminder
      - draft_review_thread
      - document_request
    approval_required: true
skill_manifest:
  id: schift/skills/startup-support-curator
  name: Startup Support Curator
  version: 0.1.0
  source: apm
  path: apm/startup-support.agent/skills/startup-support-curator/SKILL.md
  description: 한국 창업지원사업 공고를 공식 출처와 사용자 회사 근거에 맞춰 필터링하고, 오늘 지원할 1건을 고정한 뒤 일정과 사업계획서 초안을 만든다.
  references:
    - apm/startup-support.agent/skills/startup-support-curator/references/business-plan-writing-playbook.md
    - apm/startup-support.agent/skills/startup-support-curator/references/submitted-plan-frontmatter-style.md
    - apm/startup-support.agent/skills/startup-support-curator/references/diagram-generation-guide.md
    - apm/startup-support.agent/skills/startup-support-curator/references/required-markers-checklist.md
  inputs:
    - founder_profile
    - company_materials
    - official_notice_sources
    - connected_source_context
    - session_memory
    - application_form_template
    - company_profile_sources
  rules:
    - official-notice-first
    - do-not-invent-deadline-amount-eligibility-or-url
    - separate-open-upcoming-closed-by-kst-today
    - match-by-company-stage-region-industry-and-exclusion-conditions
    - mark-unknown-as-confirmation-needed
    - calendar-actions-require-user-approval
    - telegram-discord-send-requires-channel-connection-and-approval
    - draft-bizplan-from-user-evidence-not-generic-ai-copy
    - apm-means-agent-hub-package-not-application-performance-monitoring
    - no-auto-apply-no-auto-submit
    - one-best-notice-today
    - founder-decision-first
    - html-artifact-is-primary-output
    - template-first-when-provided
    - evaluator-facing-tone-when-template-provided
    - company-metadata-from-rag
  output_contract:
    format: html
    required_sections:
      - '1'
      - '2'
      - '3'
      - '4'
      - 5-0
      - 5-1
      - 5-2
      - 5-3
      - 5-4
      - '6'
    artifact_type: document
    html_requirements:
      - 마크다운 테이블 문법(|) 금지. 표는 <table>/<thead>/<tbody>/<tr>/<th>/<td> 태그 사용.
      - 도식 초안은 <pre>, <ul>, <ol> 중 하나로 감싼다.
      - 섹션 제목은 <h2>~<h4>, 본문은 <p>, 공식 링크는 <a href="..."> 사용.
      - HTML은 브라우저에서 렌더링 가능한 self-contained 문서여야 한다.
      - 공고별 신청서 양식이 제공되면 양식의 섹션 제목과 순서를 그대로 반영한다.
      - 회사 메타정보는 company_profile_sources에서 조회한 값으로 채우고, 누락 항목은 [제출 전 확인]으로 표기한다.
      - document_hierarchy.subsection_bullet_headings에 지정된 하위 절의 핵심 근거는 2~4개의 <ul>/<li> 또는 <ol>/<li> list로 먼저 정리하고, 상세 설명/도식/표는 그 이후 단락이나 <table>로 작성한다. 첫 분석기가 양식을 해석해 이 필드를 주입한다.
  awp_operations:
    - startup_support.notice_curate
    - startup_support.deadline_calendar_plan
    - startup_support.channel_digest_draft
    - startup_support.business_plan_draft
document_hierarchy:
  template_id: schift_startup_support_curator_v1
  title: 지원사업 큐레이션
  kind: document
  required_sections:
    - '1'
    - '2'
    - '3'
    - '4'
    - 5-0
    - 5-1
    - 5-2
    - 5-3
    - 5-4
    - '6'
  subsection_bullet_headings:
    - 문제인식
    - 실현가능성
    - 성장전략
    - 팀 구성
  delivery:
    mode: apm_digest_and_draft
    calendar: google_calendar
    notifications:
      - telegram
      - discord
  knowledge:
    retrieval_required: false
    source_strategy: startup_support_source_pack_then_live_official_search_then_connected_files
  official_method_references:
    - id: k-startup-official-portal
      title: K-Startup 공식 공고와 첨부 양식
      url: https://www.k-startup.go.kr/
      rule: 공고별 첨부 양식, 신청기간, 자격, 제출서류를 최우선 근거로 사용한다.
    - id: bizinfo-official-portal
      title: 기업마당 지원사업 공고
      url: https://www.bizinfo.go.kr/
      rule: 기업마당이 타 기관 공고를 집계한 경우 원본 기관 링크를 우선한다.
    - id: kised-initial-package
      title: 창업진흥원 초기창업패키지 사업화 지원 범위
      url: https://www.kised.or.kr/menu.es?mid=a10205020000
      rule: 사업화자금은 시제품 제작, 마케팅, 지식재산권 등 공고가 허용하는 비목에만 연결한다.
    - id: mss-2026-startup-policy
      title: 중소벤처기업부 2026 창업지원 방향
      url: https://www.mss.go.kr/site/smba/ex/bbs/View.do?bcIdx=1066336&cbIdx=86
      rule: AI 작성 지원과 간소화 기조는 참고하되 사업별 세부 평가는 해당 공고와 첨부 양식을 우선한다.
    - id: local-go-kr-portal
      title: 지자체·공공기관 go.kr 공식 공고
      url: https://www.gov.kr/
      rule: 지자체·청년·지역 창업 프로그램은 go.kr/or.kr/ac.kr 공식 페이지만 확정 근거로 삼는다.
  writing_references:
    - id: business-plan-writing-playbook
      path: apm/startup-support.agent/skills/startup-support-curator/references/business-plan-writing-playbook.md
      purpose: PSST 기반 사업계획서 섹션별 작성법, 제출체, 표 구조, 근거 부족 시 고정 문장.
    - id: submitted-plan-frontmatter-style
      path: apm/startup-support.agent/skills/startup-support-curator/references/submitted-plan-frontmatter-style.md
      purpose: 실제 제출본 앞부분의 신청서/요약, 문체, 표, 도식 구성 패턴.
    - id: diagram-generation-guide
      path: apm/startup-support.agent/skills/startup-support-curator/references/diagram-generation-guide.md
      purpose: 5-0~5-4 하위 절별 도식 초안. 기본 출력은 HTML 아티팩트 내 <pre>/<table> 텍스트 도식이며, 별도 visual asset 파이프라인 연결 시에만 Mermaid/SVG/Excalidraw를 사용한다.
    - id: forbidden-example-words
      path: apm/startup-support.agent/skills/startup-support-curator/references/forbidden-example-words.md
      purpose: 근거 없는 수치, 성과, 보안/배포 주장, 시장 일반론, 잘못된 APM 확장의 canonical list. forbidden_patterns와 rewrite_patterns의 단일 출처.
    - id: application-form-template-mapping
      path: apm/startup-support.agent/skills/startup-support-curator/references/application-form-template-mapping.md
      purpose: 공고별 신청서 양식이 제공되었을 때 양식 구조와 항목명을 그대로 따라 제출용 초안을 만드는 매핑 가이드. 회사 메타정보 RAG 채움, 평가자 중심 제출체, S-CUBE 양식 예시 포함.
    - id: required-markers-checklist
      path: apm/startup-support.agent/skills/startup-support-curator/references/required-markers-checklist.md
      purpose: 최종 HTML 아티팩트에 반드시 포함되어야 하는 QC 계약 문구(HTML 아티팩트, 공식 링크, 공고 평가항목, 캘린더 후보, 회사 근거, 창업자 의사결정 등)의 배치 가이드.
  operation_loop:
    mode: zodal_like_apm
    sequence:
      - 조건 정리
      - 공식 공고 수집
      - 공고별 신청서 양식 해석 (제공된 경우)
      - 회사 메타정보 RAG 조회 (제공된 경우)
      - 적합도 판단과 최우선 공고 고정
      - 캘린더 후보와 Telegram/Discord 발송 초안
      - 5개 사업계획서 draft sub-agent fanout
      - 제출 전 확인사항과 founder QC
    handoff_memory:
      - normalized_founder_profile
      - notice_candidates
      - application_form_template_structure
      - subsection_bullet_headings
      - company_metadata_from_rag
      - fit_ranking_with_selected_notice
      - selected_notice
      - notice_evaluation_criteria
      - source_fact_table
      - company_evidence_table
      - calendar_and_notifications
  curation_strategy:
    official_source_priority:
      - k-startup.go.kr
      - mss.go.kr
      - kised.or.kr
      - bizinfo.go.kr
      - go.kr
      - or.kr
      - ac.kr
    status_values:
      - 추천
      - 보류
      - 제외
    deadline_states:
      - 지금 지원 가능
      - 마감 임박
      - 곧 열림
      - 마감됨
      - 기간 확인 필요
    deadline_state_thresholds:
      기준: 주입된 KST 오늘 날짜 기준
      지금 지원 가능: 신청 시작일 <= 오늘 <= 마감일
      마감 임박: 마감일 - 오늘 <= 7일
      곧 열림: 신청 시작일 - 오늘 <= 14일
      마감됨: 마감일 < 오늘
      기간 확인 필요: 신청기간이 비어 있거나 모호함
    eligibility_gates:
      - 업력
      - 지역
      - 대표자 나이
      - 업종
      - 매출
      - 고용
      - 투자
      - 중복수혜
      - 제출서류
    candidate_table_columns:
      - 사업명
      - 기관
      - 상태
      - 신청기간
      - 지원규모
      - 핵심 자격
      - 제외조건
      - 제출서류
      - 첨부양식
      - 공식 링크
      - 출처 상태
    ranking_columns:
      - 상태
      - 추천 이유
      - 배제 조건
      - 리스크
      - 다음 행동
      - 확인 질문
  calendar_contract:
    event_types:
      - briefing_session
      - document_collection
      - draft_review
      - application_deadline
      - submission_day
    candidate_columns:
      - 캘린더 제목
      - 날짜
      - 설명
      - 근거 URL
      - 등록 이유
      - 승인 상태
    approval_states:
      - 후보
      - 사용자 승인 필요
      - 연결 필요
      - 등록 요청 가능
    deadline_backplan: 마감일 하나만 만들지 않고 서류 수집, 초안 검토, 제출 전 확인 일정을 역산한다.
  channel_contract:
    vendors:
      - telegram
      - discord
    message_use_cases:
      - daily_digest
      - deadline_reminder
      - missing_documents
      - draft_review_request
    output_columns:
      - 채널
      - 수신 대상
      - 발송 목적
      - 메시지 초안
      - 승인 상태
    approval_states:
      - 발송 초안
      - 채널 연결 필요
      - 사용자 승인 필요
    never_claim_sent: true
  business_plan_rubric:
    form_priority: 공고 첨부 양식이 있으면 PSST보다 우선한다. 양식의 섹션 제목, 순서, 항목명을 그대로 따른다.
    template_first: application_form_template이 제공되면 양식 해석을 먼저 수행하고, 신청서 필드는 company_profile_sources(RAG)로 채운다. 양식에 없는 PSST 절은 만들지 않는다.
    evaluator_tone: 양식이 제공되면 말투를 평가자 중심 제출체로 전환한다. '오늘 의사결정', '확인이 필요해 보입니다', '검토했습니다' 같은 조력자/보고체를 쓰지 않는다. '확인 필요'는 질문형이 아니라 '제출 전 확인'으로 선언형 표기한다.
    company_metadata: 기업명, 대표자, 사업자번호, 창업일, 업력, 매출, 고용, 투자, 지식재산권, 타지원사업실적, 팀 구성은 company_profile_sources에서 조회한 값으로 채운다. 값이 없으면 [제출 전 확인]으로 표기한다.
    overview: 사업개요는 아이템 한 줄 정의, 고객 결과, 공고 적합성, 준비 정도, 대표 도식을 포함한다.
    problem: 문제인식은 시장 일반론이 아니라 고객 업무 병목, 기존 대안 한계, 공고 목적 연결, 증거를 요구한다.
    solution: 실현가능성은 핵심기능, 사용처, 소비자층, 현재 개발단계, 차별성, 검증 방법을 연결한다.
    growth: 성장전략은 시장 진입, 채널, 가격/수익모델, 협약기간 milestone, KPI 확인 계획을 분리한다.
    team: 팀 구성은 개인정보가 아니라 이 과제를 수행할 수 있는 역할, 근거, 부족 역할을 쓴다.
    budget: 예산은 비목, 산출근거, 수량, 시점, 산출물을 분리하고 공고 허용 비목 밖 금액을 만들지 않는다.
    evidence: 본문 주장과 증빙 보유 상태를 분리한다. 증빙 없으면 확정 표현 대신 제출 전 확인으로 내린다.
  diagram_selection_policy:
    rule: 각 5-0~5-4 하위 절은 텍스트만으로 끝나지 않고 표 또는 도식 초안을 포함한다. diagram-generation-guide의 섹션별 매핑을 따른다.
    output_format: 기본 출력은 HTML 아티팩트 내 <pre>/<table> 텍스트 도식 초안이다. 별도 visual asset 파이프라인이 연결된 경우에만 Mermaid/SVG/Excalidraw로 변환한다.
    fallback_format: <pre>/<table> 텍스트 도식 초안을 항상 포함한다.
    section_map:
      - section: 5-0
        allowed_diagrams:
          - 이해관계자 가치 흐름
          - 제품 파이프라인
          - 준비 정도 표
      - section: 5-1
        allowed_diagrams:
          - 문제 3분할 카드
          - 직접 구축 vs 제품 사용 비교
          - 고객 세그먼트 표
      - section: 5-2
        allowed_diagrams:
          - 입력-처리-출력 흐름
          - 경쟁 포지셔닝 2축
          - 경쟁자 비교표
          - 기술 KPI표
      - section: 5-3
        allowed_diagrams:
          - GTM 채널 표
          - 기관 패키지 표
          - 이해관계자 가치표
          - 누적 막대 로드맵
          - 협약기간 월별 과제표
      - section: 5-4
        allowed_diagrams:
          - 팀/회사 근거표
          - 증빙 제출 체크리스트
  submitted_plan_structure:
    section_5_policy: 사업계획서 초안은 단일 요약문이 아니라 5-0~5-4 하위 절로 작성한다.
    minimum_depth:
      5-0: 1500
      5-1: 1800
      5-2: 2200
      5-3: 2200
      5-4: 1200
    evidence_terms:
      - 공고 평가항목
      - 회사 근거
      - 확인 필요
      - 도식 초안
    diagram_contract:
      5-0: 이해관계자 가치 흐름 또는 제품 파이프라인
      5-1: 문제 3분할 카드와 직접 구축 vs 제품 사용 비교
      5-2: 입력-처리-출력 흐름, 경쟁 포지셔닝, 경쟁자 비교표
      5-3: GTM 채널 표, 기관 패키지 표, 누적 막대 로드맵
      5-4: 팀/회사 근거표와 제출 증빙 체크리스트
  input_normalization:
    raw_unsupported_terms_are_volatile: true
    writer_receives_only: normalized_founder_profile
    principle: 사용자가 근거 없음으로 준 원문 예시어는 downstream writer에게 전달되지 않는다. forbidden-example-words.md의 정규화 카테고리로만 변환한다.
    examples:
      - category: 고객/파일럿 근거
        raw: 파일럿 고객 3곳, 초기 고객사 5곳 선정
        normalized: 고객/파일럿 목표는 영업 파이프라인과 근거 자료 확인 후 확정
      - category: 보안/배포 요구사항
        raw: 온프레미스 배포, ISMS 인증, 데이터 유출 위험 최소화
        normalized: 보안/배포 요구사항은 제출 전 확인
      - category: 성과 측정 기준
        raw: 문서 처리 정확도 99% 이상, 처리 시간 50% 단축
        normalized: 문서 처리 품질, 처리 시간, 고객/파일럿, 매출 목표는 측정 기준과 근거 자료 확인 후 확정
      - category: 대표/팀 근거
        raw: AI 개발 경험 5년, 개발 2명/기획영업 1명
        normalized: 현재 임직원 3명이며 직묳별 구성과 채용 계획은 제출 전 확인 필요
      - category: 제품/서비스 개요
        raw: RAG 기반 지원사업 매칭 에이전트
        normalized: 제품/서비스 핵심 기능은 회사 자료와 근거 확인 후 확정
      - category: 예산/자금 운용
        raw: 마케팅 3천만원, 인걸비 2천만원
        normalized: 지원금 활용 세부 산정이 필요하다. 비목별 금액은 공고 허용 범위와 예산안 확인 후 확정
    rules:
      - 고객/파일럿 관련 원문 예시는 고객/파일럿 근거 카테고리로 정규화한다.
      - 보안/배포 관련 원문 예시는 보안/배포 요구사항 카테고리로 정규화한다.
      - 정확도/처리시간/성과 관련 원문 예시는 성과 측정 기준 카테고리로 정규화한다.
      - 대표/팀 경력과 직묳별 인원 원문 예시는 대표/팀 근거 카테고리로 정규화한다.
      - 사업/아이템/제품 관련 원문 예시는 제품/서비스 개요 카테고리로 정규화한다.
      - 예산/지원금/비목 관련 원문 예시는 예산/자금 운용 카테고리로 정규화한다.
  research_queries:
    - K-Startup 2026 창업지원사업 모집 공고 신청기간 k-startup.go.kr
    - 기업마당 2026 창업 지원사업 모집 공고 bizinfo.go.kr
    - 창업진흥원 2026 창업패키지 모집 공고 kised.or.kr
    - 중소벤처기업부 2026 창업지원사업 통합공고 mss.go.kr
    - 지역 창업지원센터 2026 창업지원사업 모집 공고 go.kr
    - 2026 청년창업사업 지원사업 모집 공고 site:go.kr
    - 2026 여성창업 지원사업 모집 공고 site:go.kr
    - 2026 지역혁신형 창업 지원사업 모집 공고 site:go.kr
  quality_gate:
    user_job: 사용자는 오늘 지원할 만한 사업 1건, 놓치면 안 되는 마감, 제출 전에 모아야 할 자료, 바로 다듬을 사업계획서 초안을 알고 싶다.
    official_source_rule: 금액, 마감, 자격, 제출서류, URL은 공식 공고나 사용자가 제공한 파일에서 확인된 것만 확정한다.
    calendar_rule: 일정 등록은 사용자가 요청하거나 승인한 경우에만 한다. 후보 일정은 먼저 제목, 날짜, 설명, 근거 URL로 보여준다.
    notification_rule: Telegram/Discord 발송은 연결된 채널과 승인 없이는 하지 않는다. 산출물에는 발송 초안과 수신 대상만 남긴다.
    draft_rule: 사업계획서 초안은 business-plan-writing-playbook의 PSST 섹션 계약과 공고 평가항목을 함께 따른다. 일반적인 AI 홍보 문장으로 빈칸을 채우지 않는다.
    one_best_notice_rule: 추천 후보가 여러 개여도 오늘 의사결정을 위해 가장 적합한 1건을 selected_notice로 고정하고 나머지는 다음 행동으로 남긴다.
    html_output_rule: 최종 산출물은 HTML 아티팩트로 렌더링하며, 표와 도식 초안은 브라우저에서 읽을 수 있는 마크업 구조로 남긴다.
  authoring_quality_gate:
    minimum_review_depth: 산출물은 공고 링크 모음이 아니라 창업자가 오늘 의사결정할 수 있는 지원사업 검토본이어야 한다. 각 추천에는 추천 이유, 배제 조건, 다음 행동, 확인 질문이 있어야 한다.
    short_output_rejection: 공고 후보 표, 적합도 판단, 일정 후보, 사업계획서 본문 중 하나라도 빠지면 초안으로 보지 않는다. "추후 확인"만 반복하는 문단은 실패다.
    evidence_rule: 공식 공고와 사용자 회사 자료에서 확인된 사실만 확정 표현으로 쓴다. 근거가 약하면 확인 필요로 낮추고, 어떤 파일이나 답변이 필요한지 질문으로 남긴다.
    required_traceability: 추천 공고, 캘린더 후보, Telegram/Discord 문구, 사업계획서 문단은 각각 공식 공고 URL 또는 사용자 회사 근거와 연결되어야 한다.
    revision_instruction: 마지막 편집은 맞춤법 검사가 아니라 창업자 관점의 의사결정 정리다. 중복 표, 내부 실행어, 근거 없는 과장 문구를 삭제하고 다음 행동을 앞으로 올린다.
  customer_quality_gate:
    user_job: 고객은 결과물을 보고 이번 주에 지원할 사업, 포기할 사업, 모을 서류, 캘린더에 넣을 마감, 초안 수정 방향을 바로 판단할 수 있어야 한다.
    decision_ready: 각 추천은 추천/보류/제외 상태, 이유, 리스크, 다음 행동을 포함한다. 최우선 공고는 selected_notice로 별도 고정한다.
    founder_language: 내부 구현명, agent, token, bucket, MCP, crawler 같은 실행 내부 용어는 고객-facing 본문에 쓰지 않는다. 필요하면 "연결된 자료", "업로드 파일", "공식 공고"로 바꾼다.
    source_visibility: 확정 사실, 추정, 확인 필요를 분리한다. 금액, 마감, 제출서류는 공식 출처 링크와 함께 보여준다.
    final_review_warning: 자동 생성본은 제출 전 검토본이다. 신청 자격, 제출서류, 접수 완료, 최종 제출은 사람이 공식 공고에서 확인한다.
  artifact_quality_algorithm:
    hard_fail_test: 최종 산출물에 APM을 Monitoring 계열 영어 약어로 풀거나, 임직원 3명을 역할별 1명 단위로 쪼개면 실패다. APM은 지원사업 에이전트 패키지 매니페스트로만 설명하고, 인력은 현재 3명 및 직무별 구성 확인 필요로만 둔다.
    persona_shift: 작성자는 내부 시스템이 아니라 오늘 지원사업을 찾는 창업자 또는 대표의 자리에서 읽는다.
    read_order: 먼저 바로 지원 가능한 사업과 마감 임박 항목을 보여주고, 그 다음 보류/제외와 사업계획서 초안을 둔다.
    final_output_ban_test: forbidden-example-words.md에 있는 근거 없는 수치/성과/보안/배포/APM 확장 예시어는 최종 산출물 어디에도 반복하지 않는다. 삭제/변경 예시어를 체크리스트에 그대로 남기지 않고, 고객/파일럿 근거, 시장/수요 자료, 보안/배포 요구사항 같은 정규화 카테고리로 묶는다.
    unsupported_input_normalization_test: 사용자가 근거 없음으로 준 항목은 내 조건 요약, 사업계획서 초안, 제출 전 확인사항 어디에서도 원문 예시어를 반복하지 않는다. 고객/파일럿 근거, 보안/배포 요구사항, 성과 측정 기준, 대표/팀 근거 같은 카테고리명으로 정규화한다.
    apm_term_test: APM은 Schift Agent Hub에서 실행되는 에이전트 패키지/업무 매니페스트다. Application Performance Monitoring, 애플리케이션 성능 모니터링, 서버 관제, 장애 감지 사업으로 풀어 쓰면 실패다.
    product_focus_test: 사업계획서 초안은 사용자가 제공한 제품/서비스를 중심으로 설명한다. Schift Agent Hub, RAG, OCR, 문서/업무 자동화 워크플로 같은 낭부 구현 용어는 사용자 회사의 실제 제품에 맞춰 쓰거나, 해당 제품과 무관하면 생략한다. 사용자가 제공하지 않은 서버 성능 모니터링 제품 서사는 쓰지 않는다.
    playbook_usage_test: 사업계획서 초안은 business-plan-writing-playbook의 문제인식, 실현가능성, 성장전략, 팀 구성 계약과 submitted-plan-frontmatter-style의 실제 제출본 앞부분 구성법을 사용한다. 단일 "5. 사업계획서 초안" 요약으로 쓰면 실패이며, 5-0 사업개요 요약, 5-1 문제인식, 5-2 실현가능성, 5-3 성장전략, 5-4 팀 구성 및 증빙으로 나눠야 한다.
    diagram_brief_test: 5-0~5-4 각 하위 절에는 표 또는 도식 초안을 포함한다. 이미지를 만들 수 없으면 도식 초안으로 이해관계자 가치 흐름, 제품 파이프라인, 문제 3분할 카드, 직접 구축 vs 제품 사용 비교, 입력-처리-출력 흐름, 경쟁 포지셔닝, GTM 채널, 기관 패키지, 누적 막대 로드맵, 팀/증빙 체크리스트 중 해당 절에 맞는 것을 남긴다.
    submitted_plan_density_test: 5-0~5-4 하위 절 중 하나라도 공고 평가항목, 회사 근거, 도식 초안, 확인 필요 중 필요한 항목을 빠뜨리면 HOLD다. 표는 generic KPI가 아니라 해당 공고와 회사 자료에서 확인된 근거만 사용한다.
    evidence_audit: 모든 추천 이유 옆에서 이 근거를 공식 공고나 회사 파일로 다시 확인할 수 있는지 확인한다. 없으면 확정하지 않는다.
    eligibility_gate_test: 업력, 지역, 업종, 대표자 나이, 매출, 고용, 중복수혜 같은 gate는 일반 리스크가 아니라 지원 가능 여부 판단 항목이다.
    source_fact_test: 공고명, 기관명, 신청기간, 지원규모, 제출서류, URL은 공식 출처에 있는 값을 그대로 쓴다. 값이 없으면 확인 필요로 둔다.
    calendar_action_test: 캘린더 일정은 마감일 하나만 만들지 말고 서류 수집, 초안 검토, 제출 전 확인 같은 실행 일정을 포함한다.
    channel_action_test: Telegram/Discord는 발송 완료가 아니라 발송 초안, 수신 채널, 승인 필요 상태로 표현한다.
    draft_specificity_test: 사업계획서 초안은 해당 공고명과 평가항목을 직접 언급해야 한다. 어느 공고에도 붙일 수 있는 일반 문구면 실패다.
    connected_file_test: 사용자가 회사 소개서나 기존 사업계획서를 제공했다면 그 근거를 사업계획서 초안의 claim에 연결한다.
    unsupported_metric_test: 정확도, 성장률, 시장/수요 크기, 매출 목표, 고객 수, 파일럿 수, 대표/팀 경력연수, 보안/배포 주장 같은 수치와 claim은 입력 근거가 있을 때만 쓴다. 근거가 없으면 목표 초안 또는 확인 필요로 낮춘다.
    unsupported_target_number_test: 근거가 없는 숫자는 "[확인 필요]" 뒤에도 붙이지 않는다. 예를 들어 "95% 이상 목표", "파일럿 고객 2곳", "개발 2명"처럼 목표 숫자를 새로 넣으면 실패다.
    unsupported_customer_pipeline_test: 근거가 없는 고객사, 파일럿, 계약, 운영 개수를 만들지 않는다. "초기 고객사 3곳", "3곳 선정", "2곳 계약", "10개사 파일럿", "100개사 고객"처럼 숫자로 실행 성과나 목표를 쓰면 실패다.
    unsupported_market_number_test: 출처가 없는 시장/수요 숫자와 성장 표현을 만들지 않는다. "300만 개 이상", "매년 증가", "50% 이상 단축"처럼 공신력 있는 근거가 없는 시장/KPI 숫자는 실패다.
    unsupported_security_text_test: 보안 인증, 보안 강화, 온프레미스, 데이터 유출 위험 최소화, 배포 형태, ISO 27001, ISMS는 회사 파일이나 공고 요구사항에 명시된 경우에만 쓴다. 회사 파일에 없으면 취득 계획으로 추가하지 않고 확인 과제로만 둔다.
    forbidden_example_echo_test: 금지 예시는 최종 산출물에 그대로 반복하지 않는다. 사용자가 보안/배포 예시를 근거 없음으로 줬다면 원문 예시어를 쓰지 말고 "보안/배포 요구사항은 제출 전 확인"처럼 묶어 표현한다.
    business_plan_security_scope_test: 사업계획서 본문과 제출 전 확인사항에서도 특정 보안 인증, 구축 방식, 데이터 유출 최소화 방안을 회사 근거 없이 쓰지 않는다. 보안/배포는 확인 과제로만 둔다.
    unsupported_performance_claim_test: 정확도 수치뿐 아니라 "정확도를 향상", "정확도 개선" 같은 성능 개선 claim도 측정 근거가 없으면 쓰지 않는다.
    budget_scope_test: 지원금 활용 계획은 공고 한도 내 예시로만 쓰고, 인걸비/클라우드/마케팅 금액을 새로 확정하지 않는다. 사용자가 예산안을 주지 않았으면 [예산 세부 산정 필요]로 둔다.
    team_claim_test: 대표와 팀의 경력, 전문 분야, 역할, 직무별 인원, 채용 계획은 입력에 있는 사실만 쓴다. "개발 경험 5년 이상", "개발 2명", "개발 인력 1명 추가 채용", "대표 1명", "기획/영업 1명" 같은 역할별 인원 배분은 근거가 없으면 쓰지 않는다.
    no_submission_test: 자동 신청, 자동 제출, 선정 가능성 보장을 암시하면 실패다.
    html_artifact_test: 최종 아티팩트는 HTML로 렌더링되며, 표와 도식 초안은 `<table>`, `<ul>`, `<ol>`, `<pre>` 등 브라우저 표현 가능한 마크업으로 남긴다. PDF/HWP 변환은 제출 전 사람 확인 단계로 넘긴다.
  safe_bizplan_template:
    customer_demand: 주요 고객은 사용자 회사 제품/서비스가 해결하는 업무를 겪는 조직이다. 시장/수요 자료는 공신력 있는 자료 확인 후 확정한다.
    execution_plan: 제품 고도화, 공식 공고/필요 서류 정리, 파일럿 설계 순서로 진행한다. 고객/파일럿 목표는 근거 자료 확인 후 확정한다.
    budget_staffing: 지원금 활용 세부 산정이 필요하다. 현재 임직원 수는 회사 프로필(RAG) 기준이며 직묳별 구성과 채용 계획은 제출 전 확인 필요하다.
    metrics: 제품 품질, 처리 시간, 고객/파일럿, 매출 목표는 측정 기준과 근거 자료 확인 후 확정한다.
    security_deployment: 보안/배포 요구사항은 제출 전 확인한다.
  final_artifact_polish:
    enabled: true
    mode: startup-support-founder-qc
    temperature: 0.1
    timeout_seconds: 180
    instruction: 최종 윤문은 새 작성이 아니라 창업자 의사결정 편집 단계다. 최종 산출물 본문에 '창업자 의사결정' 문구가 명시적으로 들어가도록 한다. 중복 공고, 중복 제목, 내부 실행어, 근거 없는 과장어를 삭제하고 추천 상태, 마감, 다음 행동, 확인 질문을 앞으로 올린다. 공고명, 기관명, 날짜, 금액, URL은 절대 바꾸지 않는다. HTML 아티팩트의 표 구조와 도식 초안은 브라우저에서 깨지지 않도록 검증한다.
  artifact_revision_mode:
    enabled: true
    mode: chat-like-continuous-polish
    artifact_prompt_section: volatile
    temperature: 0.1
    timeout_seconds: 180
    max_input_chars: 32000
    previous_artifact_prefixes:
      - 'draft_artifact:'
      - 'previous_artifact:'
      - 'artifact_draft:'
    feedback_prefixes:
      - 'user_feedback:'
      - 'revision_request:'
      - 'edit_request:'
    instruction: 후속 피드백이 들어오면 전체 수집 과정을 다시 반복하지 말고 직전 검토본을 기준으로 편집한다. 다만 마감일, 금액, 자격, 제출서류는 공식 공고 근거를 우선한다. HTML 구조는 유지하며 텍스트만 교체한다.
  qc_revision_loop:
    enabled: true
    max_passes: 2
    instruction: QC가 HOLD 또는 PROCEED_WITH_FIXES이면 findings를 섹션에 반영한 뒤 다시 검수한다. forbidden_patterns와 rewrite_patterns는 최종 산출물 전체에 적용한다. forbidden-example-words.md의 근거 없는 수치/성과/보안/배포/APM 확장 예시어가 본문이나 체크리스트에 남아도 HOLD다. 두 번째 QC도 HOLD이면 최종 리포트에 HOLD와 사유를 유지한다.
  artifact_quality_checks:
    required_patterns:
      - name: official_source_marker
        pattern: 공식 링크
      - name: human_review_marker
        pattern: 제출 전 확인
      - name: calendar_candidate_marker
        pattern: 캘린더 후보
      - name: submitted_overview_marker
        pattern: 사업개요 요약
      - name: problem_marker
        pattern: 문제인식
      - name: solution_marker
        pattern: 실현가능성
      - name: growth_marker
        pattern: 성장전략
      - name: team_evidence_marker
        pattern: 팀 구성
      - name: diagram_brief_marker
        pattern: 도식 초안
      - name: notice_criteria_marker
        pattern: 평가항목
      - name: company_evidence_marker
        pattern: 회사 근거
      - name: html_artifact_marker
        pattern: HTML 아티팩트
      - name: founder_decision_marker
        pattern: 의사결정
      - name: section_6_full_title
        pattern: 제출 전 확인사항
    forbidden_patterns:
      - name: auto_submit_claim
        pattern: 자동 제출 완료
      - name: guaranteed_selection_claim
        pattern: 선정 가능성이 높습니다
      - name: sent_notification_claim
        pattern: 알림을 보냈습니다
      - name: internal_runtime_leak
        pattern: (?:MCP|crawler|bucket|token|ReAct)
      - name: unsupported_accuracy_percent
        pattern: (?:정확도\s*99%|99%\s*이상|정확도\s*[0-9]+%|정확도를\s*향상|정확도\s*개선)
      - name: unsupported_market_growth
        pattern: (?:연평균 성장률|CAGR|시장 규모\s*[0-9]|[0-9]+만\s*개\s*이상|매년 증가)
      - name: unsupported_founder_experience
        pattern: (?:개발 경험\s*[0-9]+년|경험\s*[0-9]+년\s*이상)
      - name: unsupported_customer_count
        pattern: (?:파일럿 고객\s*[0-9]+(?:사|곳|개사)|고객\s*[0-9]+(?:사|곳|개사)|고객사\s*[0-9]+(?:사|곳|개사)|초기 고객사\s*[0-9]+(?:사|곳|개사)|초기 창업기업\s*[0-9]+개사|[0-9]+(?:~|-)[0-9]+곳\s*(?:선정|계약|운영|확보)?|[0-9]+곳\s*(?:선정|계약|운영)|[0-9]+사\s*(?:선정|계약|운영)|[0-9]+개사\s*(?:대상|확보|고객|파일럿|운영)?|매출 목표\s*[0-9,]+만원)
      - name: unsupported_security_or_deployment_claim
        pattern: (?:온프레미스(?!(?:\s*[+/]\s*(?:클라우드|SaaS))?\s*선호도)|보안 강화|보안 인증(?!\s*여부)|인증 보유|데이터 유출 위험|기업 데이터 유출 위험 최소화|배포 형태|정보보호\s*관리체계|ISMS|ISO\s*27001)
      - name: unsupported_numeric_target
        pattern: (?:[0-9]+%\s*이상\s*(?:목표|단축|개선)|[0-9]+%\s*단축|[0-9]+곳\s*(?:선정|계약|운영)|[0-9]+사\s*(?:선정|계약|운영)|[0-9]+개사\s*(?:대상|확보|고객|파일럿|운영)?|초기 고객사\s*[0-9]+(?:사|곳|개사)|개발\s*[0-9]+|기획/영업\s*[0-9]+|대표\s*[0-9]+\s*명|기획/영업\s*[0-9]+\s*명|인력\s*[0-9]+명\s*추가\s*채용)
      - name: wrong_apm_expansion
        pattern: (?:APM\([^)]*Monitoring[^)]*\)|Application Performance Monitoring|Agent Performance Monitoring|애플리케이션 성능 모니터링|실시간 애플리케이션 성능 모니터링|서버 관제|장애 감지)
    rewrite_patterns:
      - name: unsupported_security_example_paren
        pattern: \s*\([^)]*(?:온프레미스|클라우드|SaaS|보안\s*인증)[^)]*\)\s*
        replacement: ''
      - name: unsupported_security_pref_example_list
        pattern: (?:온프레미스|클라우드|SaaS)(?:\s*(?:또는|/)\s*(?:온프레미스|클라우드|SaaS))?\s*선호도(?:\s*여부)?(?:[,，]\s*(?:보안\s*인증\s*)?요구사항\s*[^.!?。]*(?:확인\s*필요|등|확인))?
        replacement: 보안/배포 요구사항은 제출 전 확인
      - name: isms_iso_to_generic
        pattern: (?:ISMS(?:/ISO)?|ISO\s*27001)\s*(?:등)?\s*인증
        replacement: 보안/배포 인증
      - name: unsupported_security_cert_requirement
        pattern: 보안\s*인증\s*요구사항
        replacement: 보안/배포 요구사항
      - name: unsupported_security_question_to_verify
        pattern: (?:(?:보안/배포 요구사항\s*)?(?:\(\s*)?(?:온프레미스|클라우드|SaaS)(?:\s*(?:또는|/)\s*(?:온프레미스|클라우드|SaaS))?\s*선호도(?:\s*여부)?(?:\s*\))?(?:가|이|은|는|을|를|에)?\s*(?:있나요|어떻게\s*되나요|무엇인가요|확인\s*부탁드립니다|확인해\s*주세요|정했나요|정하셨나요|확정했나요|준비했나요|필요한가요|알려주세요|기술해\s*주세요|준비\s*부탁드립니다|되시나요|되셨나요|확인되었나요|확인되셨나요)?|보안\s*인증\s*보유\s*여부(?:가|이|은|는|을|를|에)?\s*(?:있나요|어떻게\s*되나요|무엇인가요|확인\s*부탁드립니다|확인해\s*주세요|정했나요|정하셨나요|확정했나요|준비했나요|필요한가요|알려주세요|기술해\s*주세요|준비\s*부탁드립니다|되시나요|되셨나요|확인되었나요|확인되셨나요)?)
        replacement: 보안/배포 요구사항은 제출 전 확인입니다. 관련 기준을 준비해 주세요
      - name: unsupported_security_to_verify
        pattern: (?:온프레미스|보안 강화|보안 인증|인증 보유|데이터 유출 위험|기업 데이터 유출 위험 최소화|배포 형태|정보보호\s*관리체계|ISMS|ISO\s*27001)
        replacement: 보안/배포 요구사항은 제출 전 확인
      - name: security_cert_table_label
        pattern: '보안 인증\s*(?:</td>|</th>|\n)'
        replacement: 보안/배포 요구사항은 제출 전 확인\n
      - name: onprem_cloud_preference
        pattern: '(?:온프레미스|클라우드|SaaS)(?:\s*(?:또는|/|,)\s*(?:온프레미스|클라우드|SaaS))?\s*선호도(?:\s*여부)?'
        replacement: 보안/배포 요구사항은 제출 전 확인
      - name: unsupported_pilot_expand_phrase
        pattern: (?:파일럿(?:\s*고객)?\s*)?[0-9]+개사\s*확대
        replacement: 파일럿/고객 확대 목표는 근거 자료 확인 후 확정
      - name: unsupported_pilot_expand_to_n
        pattern: '[0-9]+개사(?:로)?\s*(?:확대|확장)'
        replacement: 파일럿/고객 확대 목표는 근거 자료 확인 후 확정
      - name: unsupported_accuracy_to_validation_plan
        pattern: (?:문서 처리 정확도 99% 이상 유지|데이터 정확도를 99% 이상 확보|정확도\s*[0-9]+%(?:\s*이상)?|정확도(?:를)?\s*향상(?:시켰습니다)?|정확도\s*개선|정확도\s*제고)
        replacement: 측정 기준은 파일럿 데이터셋으로 제출 전 확정한다
      - name: unsupported_founder_experience_to_role
        pattern: AI/소프트웨어 개발 경험 [0-9]+년 이상
        replacement: AI/소프트웨어 개발 총괄
      - name: unsupported_market_size_to_verify
        pattern: (?:국내 문서 AI 시장 연평균 성장률 [0-9]+% 이상 예상|국내 중소기업 수는 [0-9]+만 개 이상|매년 증가)
        replacement: 시장/수요 규모와 성장률은 공신력 있는 자료로 제출 전 확인 필요
      - name: unsupported_pilot_count_to_goal
        pattern: (?:파일럿 고객\s*[0-9]+(?:사|곳|개사)(?:\s*계약 체결)?|초기 고객사\s*[0-9]+(?:사|곳|개사)(?:\s*선정(?:\s*및\s*파일럿 운영)?)?|초기 창업기업\s*[0-9]+개사(?:\s*대상)?|고객사\s*[0-9]+(?:사|곳|개사)|[0-9]+(?:~|-)[0-9]+곳\s*(?:선정|계약|운영|확보)?|[0-9]+곳\s*(?:선정|계약|운영)|[0-9]+사\s*(?:선정|계약|운영)|[0-9]+개사\s*(?:대상|확보|고객|파일럿|운영)?)
        replacement: 고객사와 파일럿 목표는 영업 파이프라인과 근거 자료 확인 후 확정
      - name: unsupported_numeric_target_to_verify
        pattern: (?:[0-9]+%\s*이상\s*(?:목표|단축|개선)|[0-9]+%\s*단축)
        replacement: 측정 목표는 파일럿 데이터셋과 기준을 확정한 뒤 산정
      - name: wrong_apm_expansion_to_agent_hub
        pattern: APM\([^)]*(?:Application Performance Monitoring|Agent Performance Monitoring|애플리케이션 성능 모니터링|실시간 애플리케이션 성능 모니터링|서버 관제|장애 감지)[^)]*\)
        replacement: APM(Schift Agent Hub에서 실행되는 지원사업 에이전트 패키지/업무 매니페스트)
      - name: unsupported_team_split_to_verify
        pattern: (?:개발 [0-9]+, 기획/영업 [0-9]+|대표\s*[0-9]+\s*명|기획/영업\s*[0-9]+\s*명)
        replacement: 현재 임직원 3명이며 직무별 구성과 채용 계획은 제출 전 확인 필요
      - name: unsupported_hiring_to_verify
        pattern: 개발 인력 [0-9]+명 추가 채용 예정
        replacement: 채용 계획은 예산안과 역할 정의 후 확정
      - name: unsupported_revenue_goal_to_verify
        pattern: 연간 매출 목표 [0-9,]+만원 달성
        replacement: 매출 목표는 가격 정책과 영업 계획 확인 후 확정
      - name: unsupported_amount_general
        pattern: (?:최대\s*)?[0-9,]+\s*(?:억|천만|만)\s*원(?:\s*예상)?
        replacement: 공식 공고 확인 후 확정
      - name: unsupported_guarantee_limit
        pattern: 보증한도\s*[0-9,]+\s*억\s*원(?:\s*이내)?
        replacement: 보증한도는 공식 공고 확인 후 확정
      - name: unsupported_pilot_count_phrase
        pattern: 파일럿 고객\s*[0-9]+(?:사|곳|개사)
        replacement: 파일럿 고객 수는 회사 프로필 기준
      - name: unsupported_customer_count_phrase
        pattern: 고객\s*[0-9]+(?:사|곳|개사)
        replacement: 고객사와 파일럿 목표는 영업 파이프라인과 근거 자료 확인 후 확정
      - name: unsupported_revenue_target_phrase
        pattern: 매출\s*[0-9,]+(?:억|천만|만)\s*원(?:\s*달성)?
        replacement: 매출 목표는 가격 정책과 영업 계획 확인 후 확정
      - name: unsupported_hiring_headcount_phrase
        pattern: (?:개발자|영업|개발|기획/영업)\s*[0-9]+명(?:\s*추가\s*채용)?
        replacement: 채용 계획은 예산안과 역할 정의 후 확정
      - name: unsupported_pilot_expand_phrase
        pattern: (?:파일럿\s*)?[0-9]+개사\s*확대
        replacement: 파일럿/고객 확대 목표는 근거 자료 확인 후 확정
      - name: invented_pilot_hospital_count
        pattern: 파일럿 (?:고객\s*)?(?:병원\s*)?[0-9]+(?:개\s*병원|곳|개사|개)
        replacement: 파일럿 고객 근거 자료 확인 후 확정
      - name: invented_pilot_expand_hospital
        pattern: 파일럿 고객 확대\s*\([0-9]+개\s*병원\)
        replacement: 파일럿/고객 확대 목표는 근거 자료 확인 후 확정
      - name: body_security_cert_claim
        pattern: 보안 인증(?:\s*필수|\s*필요|\s*취득|\s*보유|\s*준비)?
        replacement: 보안/배포 요구사항은 제출 전 확인
      - name: honorific_action_verbs_to_plain
        pattern: (확인|진행|사용|작성|포함|제공|추천|보류|제외|준비|확정|조정|반영|활용|운영|선정|계약|확보|고려|해당)합니다
        replacement: \1한다
      - name: honorific_adjective_verbs_to_plain
        pattern: (필요|가능|적합)합니다
        replacement: \1하다
      - name: honorific_passive_verbs_to_plain
        pattern: (확인|진행|사용|작성|포함|제공|추천|보류|제외|준비|확정|조정|반영|활용|운영|선정|계약|확보|고려|해당)됩니다
        replacement: \1된다
      - name: future_plan_honorific_to_plain
        pattern: 할\s*예정입니다
        replacement: 한다
      - name: future_passive_honorific_to_plain
        pattern: 될\s*예정입니다
        replacement: 된다
      - name: future_doel_geos_honorific_to_plain
        pattern: 될\s*것입니다
        replacement: 된다
      - name: future_badeul_honorific_to_plain
        pattern: 받을\s*예정입니다
        replacement: 받는다
      - name: typo_jikmyo_byeol
        pattern: 직묳별
        replacement: 직무 별
  sections:
    - id: '1'
      title: 내 조건 요약
      prompt: 회사 단계, 업종, 지역, 대표자 조건, 매출/고용/투자 상태, 이미 확보한 증빙 자료를 지원사업 필터 조건으로 정리한다. 개인정보 원문은 최소화하고 판단에 필요한 조걧만 남긴다. application_form_template이 제공되면 company_profile_sources(RAG)에서 조회한 회사 메타정보로 신청서 필드를 채운 '신청서 초안'도 같은 절에 포함한다. 민감정보는 마스킹하거나 [제출 전 확인]으로 둔다.
    - id: '2'
      title: 공고 후보
      prompt: K-Startup, 기업마당, 창업진흥원, 중기부, 지자체 등 공식 출처에서 후보 공고를 찾고 사업명, 기관, 지원금/규모, 신청기간, 대상, 공식 링크, 출처 상태를 표로 정리한다. application_form_template이 제공되면 양식에 맞춘 공고 정볧만 짧게 남긴다.
    - id: '3'
      title: 적합도 판단
      prompt: 후보별로 회사 조건과 공고 자격을 대조해 추천, 보류, 제외로 분류한다. 제외 사유와 확인 필요 항목을 숨기지 않는다. 가장 적합한 1건을 selected_notice로 고정하고 이유를 명시한다. application_form_template이 제공되면 양식 적합성과 회사 메타정보 충족 여부를 중심으로 판단한다.
    - id: '4'
      title: 일정과 알림
      prompt: 신청 마감, 설명회, 서류 수집, 초안 검토, 제출일을 "캘린더 후보" 일정으로 만든다. Telegram/Discord로 보낼 다이제스트와 리마인더 문구를 함께 만든다.
    - id: '5'
      title: 사업계획서 초안
      prompt: selected_notice로 고정한 1개 사업을 기준으로 business-plan-writing-playbook의 PSST 구조와 submitted-plan-frontmatter-style의 실제 제출본 앞부분 구성법에 맞춰 5-0~5-4 하위 절을 작성한다. application_form_template이 제공되면 application-form-template-mapping 가이드에 따라 양식의 섹션 제목과 순서를 그대로 사용하고, company_profile_sources에서 조회한 회사 근거로 본문을 채운다. 각 문단은 공고 평가항목과 회사 근거에 연결한다.
      children:
        - id: 5-0
          title: 사업개요 요약
          prompt: selected_notice에 맞춰 아이템 한 줄 정의, 핵심 고객, 지원사업 적합성, 준비 정도, 사업기간 목표를 제출체로 압축한다. application_form_template이 제공되면 양식의 '창업아이템 개요(요약)' 항목(명칭/범주/아이템 개요/배경 및 필요성/현황 및 구체화 방안/목표시장 및 사업화 전략/이미지)을 그대로 따른다. 이해관계자 가치 흐름 또는 제품 파이프라인 도식 초안을 포함한다.
        - id: 5-1
          title: 문제인식
          prompt: 고객 업무 병목, 현재 대안 한계, 공고 목적과의 연결을 쓴다. application_form_template이 제공되면 양식의 '1. 문제인식 (Problem)' 하위 절(1-1 개발동기, 1-2 목적/필요성)을 그대로 따른다. 문제 3분할 카드와 직접 구축 vs 제품 사용 비교 도식 초안을 포함한다.
        - id: 5-2
          title: 실현가능성
          prompt: 제품 작동 흐름, 보유 근거, 개발 범위, 검증 방법, 경쟁 대안 대비 차별성을 쓴다. application_form_template이 제공되면 양식의 '2. 실현가능성 (Solution)' 하위 절(2-1 개발·사업화 전략, 2-2 시장분석 및 경쟁력 확복방안)을 그대로 따른다. 입력-처리-출력 흐름, 경쟁 포지셔닝, 경쟁자 비교표 중 필요한 도식과 표를 포함한다.
        - id: 5-3
          title: 성장전략
          prompt: 수익모델, GTM, 기관/파트너 패키지, 일정, 자금운용, 성과 로드맵을 쓴다. application_form_template이 제공되면 양식의 '3. 성장전략 (Scale-up)' 하위 절(3-1 자금소요 및 조달계획, 3-2 시장진입 및 성과창출 전략)을 그대로 따른다. GTM 채널 표, 기관 패키지 표, 누적 막대 로드맵 또는 일정/예산 표를 포함한다.
        - id: 5-4
          title: 팀 구성 및 증빙
          prompt: 대표/팀 수행 근거, 회사 자료, 제출 증빙, 부족한 확인사항을 정리한다. application_form_template이 제공되면 양식의 '4. 팀 구성 (Team)' 하위 절(4-1 대표자 및 팀원의 보유역량)을 그대로 따른다. 팀/회사 근거표와 증빙 체크리스트를 포함하고 개인정보와 식별번호는 옮기지 않는다.
    - id: '6'
      title: 제출 전 확인사항
      prompt: 누락 자료, 자격 미확정, 수치 근거 부족, 제출서류 변환(HWP/PDF), 사람 확인이 필요한 항목만 체크리스트로 정리한다. application_form_template이 제공되면 양식의 '증빙서류' 구분(자격요건/실적/가점)과 서류명을 그대로 옮긴다. 자동 제출하지 않는다.
