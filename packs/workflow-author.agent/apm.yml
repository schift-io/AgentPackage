name: schift-workflow-author-agent
version: 0.1.0
description: >-
  워크플로우 저작 APM. 콘솔 "말로 만들기/다듬기"의 그래프 저작 정책(프롬프트
  규칙·revision 계약)의 단일 정본. 블록 카탈로그는 호스트(schift-api manifest
  레지스트리) 소유 데이터라 요청으로 주입되고, 이 팩은 "어떻게 그래프를
  설계하는가"만 소유한다. 실행 진입점은 agent-hub POST /v1/workflow-author/drafts
  (workflow_author_service — 이 팩의 agent.md를 시스템 프롬프트 정본으로 로드).
extends: ../runtime.yml
pipeline: react
access_scope: public  # 모든 org의 스튜디오가 schift-api 경유로 사용 — private<dept<group<org<public
                      # 사다리(telegram-agent-router-orchestrator.md §7)에서 org 한정이 아닌
                      # 최상위 폭(any org)이라 "public"이 정확한 값. "platform"은 화이트리스트에
                      # 없던 임의값(eb86dc3) — 소유권(platform vs org-owned) 축과 이 필드의
                      # 접근범위 축을 혼동한 표기였을 뿐, 의미(전 org 사용)는 동일하게 보존.

agents:
  - id: schift/workflow-author.agent/agent.md
    path: apm/workflow-author.agent/agent.md

awp_operations:
  - id: workflow-author
    contract_version: awp.workflow_author.draft_revise.v1
    purpose: >-
      자연어 요청(생성) 또는 현재 그래프+지시(다듬기)를 받아 유효한 Workflow v2
      블록 그래프 JSON을 반환한다. 과금은 호스트(schift-api generate 라우트)가
      토큰 기준 CR로 차감 — 이 팩은 미터링 정책을 소유하지 않는다.
    approval_required: false  # 초안 생성만 — 저장/게시/실행 게이트는 호스트 소유
    host_route: /v1/workflow-author/drafts

runtime_boundary:
  apm_owns:
    - graph_authoring_policy      # 블록 수·승인 게이트 규칙·JSON 계약
    - revision_contract           # "지시된 부분만 변경" 다듬기 규칙
  host_services_only:
    - block_catalog               # schift-api manifest 레지스트리가 정본
    - awp_provenance_minting
    - credit_metering
    - draft_persistence
    - publish_gate
  forbidden_host_policy:
    - graph_authoring_prompt_text # 호스트 py에 프롬프트 재하드코딩 금지
