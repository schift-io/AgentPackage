      - name: location_future_confirmation_to_evidence_gate
        pattern: 본점 소재지가 특정 지역으로 확정되는지 확인하고, 그 경우 증빙 자료를 즉시 수집한다
        replacement: 본점 소재지 증빙 자료를 확인하고, 증빙 없이는 참여 판단 불가로 관리한다
