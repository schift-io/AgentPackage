        replacement: 기술 역량은 회사 데이터 RAG 기반 근거와 제출 가능한 증빙으로 설명한다
      - name: remove_meta_internal_tool_wording
        pattern: 내부 도구명 대신 고객-facing 용어 사용
        replacement: 회사 데이터 RAG 기반 근거와 제출 증빙 가능성 설명
