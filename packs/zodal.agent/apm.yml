        pattern: (증빙 확보 시 참여 가능|참여 가능 여부|['"]?참여 가능['"]?)
      - name: conditional_participation_possible_sentence
        pattern: (증빙 확보 시.{0,20}참여 판단이 가능|충족할 경우.{0,20}참여가 가능|참여가 가능(하나|합니다|하다|하다고 판단됩니다)?)
      - name: location_future_confirmation
        pattern: 본점 소재지.{0,20}확정되는지
      - name: customer_surface_company_rag
        pattern: 회사 RAG
      - name: customer_surface_external_names
        pattern: (사이냅소프트|Reddit|IT조선|GridOne|Gridone|그리드원|IBK기업은행|우정사업본부|수자원공사)
      - name: unproven_security_cert_possession
        pattern: (보안 인증서\(ISMS 등\)를 보유하고 있으며|ISMS 등 보안 인증서 보유 여부|보안 인증서\(ISMS 등\) 보유 여부)
      - name: unproven_isms_compliance_claim
        pattern: ISMS 준수
      - name: unproven_developer_stack_metric
        pattern: (7\.3개|기술스택 평균)
      - name: unproven_accuracy_guarantee
        pattern: 정확도를 보장한다
      - name: unproven_rag_algorithm_possession
        pattern: 회사 데이터 RAG에 축적된 OCR 및 문서 분석 알고리즘
      - name: unproven_iso_quality_claim
        pattern: ISO 표준
      - name: zero_vulnerability_overclaim
        pattern: 보안 취약점 (0건|제로)
      - name: duplicate_evidence_marker
        pattern: 제출 전 증빙 수집\s*·\s*제출 전 증빙 수집
      - name: awkward_resubmit_marker
        pattern: 재제출 전 증빙 수집
      - name: awkward_korean_or_foreign_script
        pattern: (가능한다|입증했습니다|高精度|演练)
      - name: competitor_claim_leak
        pattern: (그리드원|GridOne|Gridone)
  research_queries:
    - 우리 회사 직군 구성 보유 인력 기술스택 실적
    - 공고 자격요건 입찰참가자격 면허 실적 제한 충족 여부
    - 추정가격 예정가격 낙찰하한율 투찰 산정 기준
    - 발주기관 공고 RFP 관련 유사 사업 수행실적 참고사례 제안서 근거
    - RFP 요구사항 평가배점 산출물 일정 업무분장
  sections:
    - id: "1"
      title: 공고·평가 루브릭 요약
      required_outputs:
        - 공고 기본정보
        - 평가배점
        - 제출 산출물
        - RFP 요구사항 코드
      prompt: '공고명, 발주기관, 공고번호, 추정가격/예산, 입찰마감, 과업범위, 첨부 파일명, 평가배점, 제출 산출물, 자격 gate를 정리한다. source_document에 값이 있으면 절대 미확정으로 쓰지 말고 그대로 복사한다(예: 제안서 접수일시 [접수일시], 발주기관 [발주기관], 추정가격 [추정가격], 기초금액 [기초금액], 공동수급 [공동수급 여부]). 확인 안 된 값만 [확인 필요]. source_document:rfp가 있으면 RFP는 확보된 상태이므로 "RFP 원문 확보 필요", "원문 미확보"라는 문구를 쓰지 않는다. RFP 요구사항 코드는 원문에 실제 항목·배점·성능수치가 있을 때만 부여한다. 원문 근거가 없는 95%, 12주, R1~R10, 기술평가 n점 같은 세부 코드는 만들지 말고 "RFP 세부 확인"으로 둔다.'
    - id: "2"
      title: RFP 요구사항 추적표
      required_outputs:
        - RFP 요구사항 추적표
        - 대응 전략
        - 산출물 매핑
        - 담당 역할
        - 일정/마일스톤
      prompt: 섹션 1의 RFP 요구사항 코드를 기준으로 요구사항 추적표를 작성한다. 필수 컬럼은 요구사항 코드, RFP 원문 근거, 평가 영향, 대응 전략, 산출물, 담당 역할, 일정/마일스톤, 상태(확정/확인 필요/리스크). 표 아래에는 요구사항 묶음별 대응 원칙과 누락 입력 질문을 문단으로 쓴다. 회사 역량 근거는 회사 데이터 RAG 검색 결과에서만 가져오고 실적·인력 수·자격증·인증을 지어내지 않는다. 섹션 1에 원문 근거 없는 코드가 있으면 그대로 확장하지 말고 "RFP 세부 확인" 행으로 낮춘다. 동일 표는 한 번만 쓴다.
    - id: "3"
      title: 우리 회사 적합성·왜 우리인지
      required_outputs:
        - 회사 데이터 RAG 근거표
        - why-us 문단
        - 근거 없음 표시
      prompt: RFP 요구사항별로 왜 우리인지를 쓴다. 회사 데이터 RAG에서 확인된 자사 역량만 사용하고 claim/source/evidence/status 표를 포함한다. 표 아래에는 요구사항별 why-us 문단을 쓰되, 근거가 약한 경우 확정형 문장을 피하고 운영 방식·검증 계획·확인 질문으로 전환한다. 회사 데이터 RAG는 단순 내부 저장소가 아니라 고객 제안서의 근거 추적·증빙 연결·요구사항 매핑 역량으로 설명한다. 근거가 없는 실적·인력·자격·인증은 [확인 필요]로 남기고 질문화한다. "실제 운영 환경", "기존 고객사", "구축 경험 보유", "알고리즘 기반을 보유"라는 표현은 미확정 문맥에서도 쓰지 말고 "운영 성과 데이터", "유사 적용 증빙", "검증 필요 역량"으로 바꾼다.
    - id: "4"
      title: 제안서 본문(RFP 대응 수행방안)
      required_outputs:
        - 사업이해
        - 요구사항별 수행방안
        - 산출물
        - 품질관리
        - 리스크 대응
      prompt: 골격 나열이 아니라 제출 검토 가능한 본문으로 길게 쓴다. 사업이해, 목표, 요구사항별 수행방안, 산출물, 품질관리, 보안/리스크, 커뮤니케이션 체계를 포함한다. 대응 RFP 요구사항 코드와 평가배점 항목은 원문 근거가 있을 때만 붙인다. 단순 bullet skeleton으로 끝내지 말고, 요구사항 묶음마다 수행 절차·검수 방식·산출물 형태·리스크 대응을 2문단 이상으로 작성한다. 특정 지역 내 공공기관 사례, 95% 정확도, 12주 일정, 특정 지역 실적처럼 증빙 없는 구체 claim은 쓰지 않는다.
    - id: "5"
      title: 추진일정·Gantt·업무분장
      required_outputs:
        - Gantt
        - 업무분장/RACI
        - 요구사항별 기간 매핑
        - 마일스톤
      prompt: RFP 요구사항 코드별로 기간, 마일스톤, 산출물, 담당 역할을 매핑한다. Gantt 표와 업무분장/RACI 표를 반드시 포함한다. 각 기간이 어떤 RFP 요구사항을 충족하는지 명시하고, 주차별 검수 gate·의사결정자·필요 입력·병목 리스크를 표 아래 문단으로 설명한다. 계약 기간 원문 근거가 없으면 12주·3개월 같은 기간을 만들지 말고 "계약 기간 확인 후 확정"으로 둔다. RAG 파이프라인, 벡터화 같은 내부 구현어는 고객이 이해할 수 있는 검색·검증 절차로 바꾼다.
    - id: "6"
      title: 가격·참여 판단·제출 전 검수
      required_outputs:
        - source_document:bid_price 기반 추정 투찰가
        - 참여 판단
        - 제출 전 검수
        - 확인 질문
        - Discord 회신 초안
      prompt: session memory에 source_document:bid_price가 있으면 그 예측 낙찰률·투찰가·유사건 분포를 1순위 근거로 사용하고 다른 숫자를 만들지 않는다. 추정가격 [추정가격]과 기초금액 [기초금액]을 구분한다. [비율]은 기초금액 [기초금액] 대비 예측 입찰가 [예측 투찰가]의 비율로만 설명하고, 추정가격 대비 비율로 쓰지 않는다. 가격평가는 협상에 의한 계약의 입찰가격 평점산식 적용으로만 쓰고, 다른 가격평가 방식과 대비하지 않는다. 금지된 가격평가 표현은 따옴표·비고·"사용 금지" 문맥에서도 쓰지 않는다. 참여 판단은 가격·자격 gate·일정·회사 근거·리스크를 분리해 쓰되, 특정 지역 본점 소재지 증빙 전에는 "참여 판단 보류" 또는 "증빙 없이는 참여 판단 불가"로만 쓴다. 금지된 참여 확정 표현은 따옴표·비고·"사용하지 않는다" 문맥에서도 쓰지 않는다. "제출 전 검수 체크리스트" 제목은 표 제목으로 한 번만 사용하고, 본문에서는 이 제목을 다시 언급하지 않는다. 불릿 제목은 "제출 전 확인사항"으로 쓴다. 확인 질문·Discord 회신 초안은 같은 제목 아래에 통합한다. 모든 수치에는 [추정 · 비보장]과 최종 결정은 사람이라는 고지를 붙인다.

sub_agent_plan:
  - id: zodal-intake-agent
    name: 공고·평가 루브릭 요약
    owns_sections: ["1"]
    purpose: 공고문/RFP를 읽고 뒤 에이전트가 참조할 RFP 요구사항 코드와 평가 루브릭을 만든다.
    voice: 꼼꼼한 입찰 PM. 짧고 사실 중심이며, 모르는 값은 즉시 [확인 필요]로 표시한다.
    output_contract: 섹션 1에는 공고 요약표, 평가 루브릭 표, RFP 요구사항 코드표를 tables 필드로 포함한다. 각 RFP 코드는 원문 근거, 평가 영향, 제출 산출물, 리스크/확인 질문을 가져야 한다.
    required_memory:
      - document_hierarchy
    output: bid_intake
    generation:
      max_tokens: 4200
      temperature: 0.2
      timeout_seconds: 180
    writing_loop:
      enabled: true
      max_revisions: 3
      min_section_chars: 1800
      expansion_rounds: 2
      reuse_base_context_for_revision: true
      reuse_base_context_for_expansion: true
      preserve_longer_draft: true
      review_prompt: 초안이 공고 요약만 하고 끝났는지 비판한다. min_section_chars 미달이면 요약하지 말고 expand-only로 보강한다. RFP 요구사항 코드표에 원문 근거, 평가 영향, 제출 산출물, 자격 gate, 리스크/확인 질문이 빠진 row를 추가한다. source_document에 있는 발주기관, 공고명, 입찰마감, 추정가격, 기초금액, 공동수급 여부를 미확정으로 쓰면 실패로 보고 정확한 값으로 고친다. 확인되지 않은 값만 단정하지 말고 [확인 필요]로 남긴다.
  - id: zodal-match-agent
    name: RFP 요구사항 추적 및 대응
    owns_sections: ["2"]
    purpose: 각 RFP 요구사항을 대응 전략, 산출물, 담당 역할, 일정 마일스톤으로 추적한다.
    voice: 제안 PM의 추적표 말투. 요구사항 누락을 잡는 데 집중하고 단정 대신 근거 상태를 표시한다.
    output_contract: 요구사항 추적표는 요구사항 코드, RFP 근거, 평가 영향, 대응 전략, 산출물, 담당, 일정, 상태 컬럼을 포함한다. 표 아래에는 요구사항 묶음별 대응 원칙과 누락 입력 질문을 문단으로 작성한다.
    required_memory:
      - document_hierarchy
      - bid_intake
    output: fit_match
    generation:
      max_tokens: 5200
      temperature: 0.2
      timeout_seconds: 240
    writing_loop:
      enabled: true
      max_revisions: 3
      min_section_chars: 2600
      expansion_rounds: 2
      reuse_base_context_for_revision: true
      reuse_base_context_for_expansion: true
      preserve_longer_draft: true
      review_prompt: 요구사항 추적표가 너무 짧거나 row 수가 부족하면 다시 쓴다. min_section_chars 미달이면 요약하지 말고 expand-only로 row와 문단을 늘린다. 각 row가 RFP 근거, 평가 영향, 대응 전략, 산출물, 담당, 일정, 상태를 모두 갖는지 자체검토하고, 표 아래에 대응 원칙과 누락 입력 질문을 보강한다. 회사 근거 없는 역량 주장은 [확인 필요]로 바꾼다.
  - id: zodal-why-us-agent
    name: 회사 데이터 RAG 근거와 Why-Us
    owns_sections: ["3"]
    purpose: 회사 데이터 RAG 근거만 사용해 RFP 요구사항별 왜 우리인지를 제안 논리로 작성한다.
    voice: 차분한 B2B 제안서 말투. 과장어 없이 확인된 회사 자산과 RFP 요구사항을 연결한다.
    output_contract: 회사 근거표(claim/source/evidence/status)와 RFP 요구사항별 why-us 문단을 포함한다. 근거 약한 claim은 확정형 홍보 문구가 아니라 검증 계획 또는 확인 질문으로 낮춘다. 소재지·입찰참가자격은 why-us가 아니라 gate 리스크이므로 source_document 증빙 전까지 회사 강점 문단에 넣지 않는다.
    required_memory:
      - document_hierarchy
      - bid_intake
      - fit_match
    output: why_us
    generation:
      max_tokens: 5200
      temperature: 0.15
      timeout_seconds: 240
    writing_loop:
      enabled: true
      max_revisions: 3
      min_section_chars: 2200
      expansion_rounds: 2
      reuse_base_context_for_revision: true
      reuse_base_context_for_expansion: true
      preserve_longer_draft: true
      review_prompt: why-us가 짧은 마케팅 문구로 끝났는지 비판한다. min_section_chars 미달이면 요약하지 말고 expand-only로 요구사항별 문단을 늘린다. 각 claim이 회사 데이터 RAG 근거표의 evidence로 뒷받침되는지 자체검토하고, 근거가 약한 claim은 확정 표현을 제거해 [확인 필요] 질문 또는 검증 계획으로 바꾼다. 회사 데이터 RAG는 요구사항-근거-증빙-리스크를 연결하는 제안 강점으로 반드시 설명한다. PMP, 인증, 인력 수, 경력연수, 유사 실적, 전담팀명, 소재지 충족은 근거가 없으면 절대 확정하거나 가정하지 않는다. "실제 운영 환경", "기존 고객사", "구축 경험 보유", "알고리즘 기반을 보유"는 근거 없는 회사 claim으로 보고 삭제한다. 소재지·입찰참가자격은 why-us 강점으로 쓰지 말고 별도 gate 리스크로만 쓰며, "특정 지역 소재 기업으로 확인되나", "소재지 충족 시", "참여 가능" 같은 문장은 source_document 증빙 없이는 실패로 보고 삭제한다. 요구사항별로 왜 우리인지, 무엇을 증명해야 하는지 문단을 보강한다.
  - id: zodal-proposal-agent
    name: 제안서 본문
    owns_sections: ["4"]
    purpose: RFP 요구사항과 평가배점에 매핑된 제출 검토용 제안서 본문을 실제 문단으로 작성한다.
    voice: 제출 직전 제안서 문체. 목록 나열을 피하고, 각 문단은 실행 방법과 산출물까지 쓴다.
    output_contract: 골격이 아니라 본문이어야 한다. 사업이해, 수행방안, 산출물, 품질관리, 보안/리스크 문단을 포함한다. 요구사항 묶음별로 수행 절차, 검수 방식, 산출물 형태, 커뮤니케이션, 리스크 대응을 실제 제출 문단처럼 작성한다.
    required_memory:
      - document_hierarchy
      - bid_intake
      - fit_match
      - why_us
    output: proposal_body
    generation:
      max_tokens: 9000
      temperature: 0.2
      timeout_seconds: 420
    writing_loop:
      enabled: true
      max_revisions: 3
      min_section_chars: 4200
      expansion_rounds: 2
      reuse_base_context_for_revision: true
      reuse_base_context_for_expansion: true
      preserve_longer_draft: true
      review_prompt: 제안서가 목차/골격/짧은 bullet로 끝났으면 실패로 보고 다시 쓴다. min_section_chars 미달이면 요약하지 말고 expand-only로 본문 문단을 늘린다. 이미 쓴 문단이나 표를 반복하지 말고 누락된 요구사항, 산출물, 검수 기준, 리스크만 추가한다. RFP 요구사항 코드, 평가배점, 수행방법, 산출물, 품질관리, 보안/리스크, 커뮤니케이션이 문단 안에 연결되는지 자체검토한다. 근거 없는 KPI 목표치(만족도 4.5, 수료율 90%, 결제 성공률 99% 등)는 [제출 전 측정 기준 확정]으로 낮춘다. 요구사항 묶음별 실행 절차와 검수 기준을 보강한다.
  - id: zodal-schedule-staffing-agent
    name: 일정·업무분장
    owns_sections: ["5"]
    purpose: RFP 요구사항이 각 기간에 어떻게 충족되는지 Gantt와 업무분장으로 작성한다.
    voice: 실행 PM 말투. 일정, 담당, 산출물, 검수 gate를 한눈에 보이게 쓴다.
    output_contract: Gantt 표, 업무분장/RACI 표, 요구사항별 기간 매핑표를 tables 필드로 반드시 포함한다. 표 아래에는 주차별 검수 gate, 의사결정자, 필요 입력, 병목 리스크를 설명한다.
    required_memory:
      - document_hierarchy
      - bid_intake
      - fit_match
      - proposal_body
    output: schedule_staffing
    generation:
      max_tokens: 6400
      temperature: 0.15
      timeout_seconds: 300
    writing_loop:
      enabled: true
      max_revisions: 3
      min_section_chars: 3200
      expansion_rounds: 2
      reuse_base_context_for_revision: true
      reuse_base_context_for_expansion: true
      preserve_longer_draft: true
      review_prompt: 일정 섹션이 단순 주차표로 끝났으면 실패로 보고 다시 쓴다. min_section_chars 미달이면 요약하지 말고 expand-only로 기간 매핑과 검수 gate 설명을 늘린다. Gantt, 업무분장/RACI, 요구사항별 기간 매핑, 주차별 검수 gate, 필요 입력, 병목 리스크가 모두 있는지 자체검토한다. PM 자격, 조달 경력연수, 투입 인원, 전담 QA/보안팀 같은 회사 근거 없는 역할·자격은 [제출 전 증빙 수집]으로 표시한다. 각 기간이 어떤 RFP 요구사항과 산출물을 충족하는지 빠진 연결을 보강한다.
  - id: zodal-price-review-agent
    name: 가격·참여 판단·제출 전 검수
    owns_sections: ["6"]
    purpose: estimator 숫자를 그대로 사용해 가격·참여 판단·제출 전 검수 질문을 마무리한다.
    voice: 보수적인 입찰 검수자. 숫자 재계산을 하지 않고 근거·리스크·사람 결정사항을 분리한다.
    output_contract: 추정 투찰가, 참여 판단, 제출 전 검수표, 확인 질문, Discord 회신 초안을 포함한다. 가격 판단은 source_document:bid_price 수치와 자격 gate/일정/회사 근거 리스크를 분리해 쓴다.
    required_memory:
      - document_hierarchy
      - bid_intake
      - fit_match
      - why_us
      - schedule_staffing
    output: price_and_review
    generation:
      max_tokens: 4800
      temperature: 0.1
      timeout_seconds: 240
    writing_loop:
      enabled: true
      max_revisions: 3
      min_section_chars: 2400
      expansion_rounds: 2
      reuse_base_context_for_revision: true
      reuse_base_context_for_expansion: true
      preserve_longer_draft: true
      review_prompt: 가격 섹션은 source_document:bid_price의 근거와 [추정가격], [기초금액], [비율], [예측 투찰가]를 구분해 설명한다. 원문과 session memory에 없는 수치는 만들지 않고, 가격·자격 gate·일정·회사 근거·검수 질문·Discord 회신의 일관성을 자체검토한다. 특정 지역 본점 gate, 입찰참가자격, 면세 여부, 공동수급 대응은 증빙 source가 없으면 "미확정 · 제출 전 증빙 수집", "증빙 없이는 참여 판단 불가", "참여 판단 보류"로 표시한다. 추정가격 대비 100% 초과를 가격 경쟁력이라고 쓰지 않는다. 사람이 결정해야 할 항목을 분리한다.

non_runnable_agent_ids: []

artifacts:
  markdown_title: 조달 입찰 대응 검토본
  include_required_tables: false
  markdown_artifact_title: 조달 입찰 대응 검토본.md
  html_artifact_title: 조달 입찰 대응 검토본.html
  visual_assets_enabled: false
  html_renderer: submission
  package_ref: schift-zodal-agent@0.1.5

hub:
  label: 조달 입찰 대응 에이전트
  role: 나라장터/조달청 공고를 우리 회사 입장에서 검토해 RFP 요구사항 추적표, 회사 근거 기반 why-us, 제안서 본문, Gantt, 업무분장, 추정 투찰가를 만듭니다. (베타 · 추정치 비보장)
  inputs:
    - 나라장터 공고 URL 또는 공고번호
    - 공고문·제안요청서(RFP) 첨부 (PDF/HWP/HWPX)
  output: 입찰 대응 검토본 — RFP 요구사항 추적표, 회사 근거 기반 why-us, 제안서 본문, Gantt/업무분장, 추정 투찰가, 제출 전 검수
  review: 적합도·투찰가는 추정치이며 비보장입니다. 최종 투찰가와 참여 여부는 담당자가 결정합니다.
  feature_flag: zodal
  intake_question: 이번 요청의 1순위 작업은 무엇인가요?
  intake_options:
    - 공고 적합도 매칭
    - 추정 투찰가 산정
    - 제안서 본문 작성

discord:
  install_mode: oauth2_application_install
  bot_token_env: SCHIFT_DISCORD_ZODAL_BOT_TOKEN
  webhook_env: SCHIFT_DISCORD_ZODAL_WEBHOOK_URL
  channel_id_env: SCHIFT_DISCORD_ZODAL_CHANNEL_ID
  commands:
    - name: bid-match
      ko_name: 공고매칭
      awp_operation: zodal.bid_match
    - name: price-estimate
      ko_name: 금액추정
      awp_operation: zodal.price_estimate
    - name: rfp-draft
      ko_name: 제안서생성
      awp_operation: zodal.rfp_draft
