name: schift-zodal-agent
display_name: "Schift Zodal Bid Advisor Agent"
version: 0.1.5
description: 나라장터/조달청 입찰 공고를 입찰자 관점으로 검토해 RFP 요구사항 추적표, 회사 근거 기반 why-us, 제안서 본문, Gantt, 업무분장/RACI, 추정 투찰가를 포함한 제출 검토용 제안서를 작성하는 에이전트 (베타, 비보장).
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: public
owner_org: org_room821
qc_enabled: true
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=False)과 바이트 동일.
pipeline: fanout

# memory 계약 — zodal-why-us-agent 섹션(회사 데이터 RAG 근거만 사용)이 회사
# core/agent-tier 메모리를 실제로 조회하려면 memory.* 툴이 fan-out in-loop
# 근거수집에 바인딩돼야 한다(bid-response와 동일 패턴, 2026-07-11
# pack-wiring-audit 갭 ⑤).
memory:
  requires:
    tools: [memory.search, memory.recall, memory.cite]
    scopes: [core, agent]

agents:
  - id: schift/zodal.agent/agent.md
    path: apm/zodal.agent/agent.md

skills:
  - id: schift/skills/zodal-bid-advisor
    path: apm/zodal.agent/skills/bid-advisor/SKILL.md
  - id: schift/skills/zodal-bid-price
    runtime: zodal-bid-price
  - id: schift/skills/zodal-rfp-fetch
    runtime: zodal-rfp-fetch
  - id: room821/skills/lightocr-parser
    runtime: schift-ocr
  - id: room821/skills/schift-memory
    runtime: schift-memory

skill_manifest:
  id: schift/skills/zodal-bid-advisor
  name: Zodal Bid Advisor
  version: 0.1.0
  source: apm
  path: apm/zodal.agent/skills/bid-advisor/SKILL.md
  description: 나라장터/조달청 입찰 공고를 입찰자 관점으로 검토해 RFP 요구사항 추적표, 회사 근거 기반 why-us, 추진일정/Gantt, 업무분장, 추정 투찰가를 포함한 제출 검토용 제안서를 작성하는 스킬 (추정치·비보장)
  inputs:
    - bid_notice_url_or_number
    - bid_notice_attachments
    - company_capability_rag_context
    - session_memory
  rules:
    - do-not-invent-bid-facts
    - do-not-invent-company-capability
    - ask-when-missing
    - bidder-side-perspective
    - estimates-are-not-guarantees
    - always-attach-basis
    - separate-fit-from-unfit
    - map-proposal-to-rubric
    - classify-rfp-requirements-as-mandatory-weighted-nice-to-have
    - mark-capability-fit-as-strong-partial-gap
    - thread-win-themes-through-multiple-requirements
    - write-full-proposal-not-outline
    - trace-each-rfp-requirement-to-deliverable-owner-and-timeline
    - include-gantt-and-work-breakdown
    - use-document-helper-for-hwp-pdf
    - human-decides-final-price-and-go-nogo
  output_contract:
    format: html
    required_sections: ["1", "2", "3", "4", "5", "6"]
    artifact_type: document
  awp_operations:
    - zodal.bid_match
    - zodal.price_estimate
    - zodal.rfp_draft

document_hierarchy:
  template_id: schift_zodal_bid_advisor_v1
  title: 조달 입찰 대응
  kind: document
  required_sections: ["1", "2", "3", "4", "5", "6"]
  authoring_quality_gate:
    minimum_review_depth: 제출 검토본은 요약 메모가 아니라 PM이 바로 사람 검토에 올릴 수 있는 1차 제안서여야 한다. 각 섹션은 표만 두고 끝내지 말고 표 아래에 판단 근거와 실행 문단을 붙인다.
    short_output_rejection: 섹션별 핵심 표 또는 본문 문단이 빠지면 초안으로 간주하고 writing_loop에서 다시 쓴다. "상세 작성 필요", "추후 보완" 같은 대체 문구로 분량을 채우지 않는다.
    evidence_rule: 회사 역량은 회사 데이터 RAG/세션 근거가 있는 claim만 확정 표현으로 쓰고, 근거가 약하면 [확인 필요]와 질문으로 낮춘다. 공고/RFP 사실과 가격 수치는 source_document 근거 없이 새로 만들지 않는다.
    required_traceability: 모든 전략·일정·업무분장·가격 판단은 RFP 요구사항 코드 또는 source_document 근거에 연결한다. 연결이 없는 문장은 삭제하거나 [확인 필요]로 표시한다.
    revision_instruction: writing_loop는 맞춤법 검사가 아니라 초안 비판과 재작성 단계다. 누락 표, 짧은 문단, 요구사항-산출물-담당-기간 연결 누락, 근거 없는 why-us를 찾아 최종본에 반영한다.
  customer_quality_gate:
    user_job: 고객은 이 결과물을 보고 입찰 참여 여부, 부족 증빙, 담당자 배정, 제안서 보완 방향을 바로 결정할 수 있어야 한다.
    decision_ready: 각 섹션은 고객이 "그래서 우리가 지금 무엇을 해야 하나"를 알 수 있게 결론, 근거, 다음 액션, 확인 질문을 포함한다.
    buyer_language: 내부 구현명보다 입찰 담당자 언어를 우선한다. Agent, ReAct, token, RAG bucket 같은 실행 내부 용어는 고객-facing 본문에 쓰지 않는다. 단, "회사 데이터 RAG"는 회사 근거 체계와 검색/증빙 역량을 설명하는 고객-facing 표현으로 허용한다.
    evidence_visibility: 확정 사실, 추정, 확인 필요를 명확히 분리한다. 고객이 증빙을 찾아야 하는 항목은 질문 목록과 담당 역할로 연결한다.
    source_fact_priority_rule: 공고/RFP source_document에 명시된 공고명, 발주기관, 입찰마감, 계약기간, 기초금액, 추정가격, 공동수급 가능 여부는 미확정으로 쓰지 않는다. source에 정확한 값이 있으면 그 값을 그대로 쓴다.
    final_review_warning: 자동 생성본은 제출 전 검토본이며, 가격·자격·실적·법적 제출요건은 사람이 최종 확인해야 한다.
    unsupported_claim_rule: 회사 데이터 RAG/세션 근거가 없는 자격증, 인증, 인력 수, 경력연수, 전담팀명, KPI 목표치(예:PMP, 조달 5년, 만족도 4.5, 수료율 90%, 결제성공률 99%)는 확정 표현으로 쓰지 않고 [제출 전 증빙 수집] 또는 [제출 전 측정 기준 확정]으로 낮춘다.
    rfp_grounding_rule: RFP 원문 또는 source_document:rfp 근거가 없으면 RFP 요구사항 코드를 새로 만들어내지 않는다. 원문 미확보 상태에서는 "작성 보류/조건부 검토"로 멈추고, 공고문 RFP 요구사항 1항 같은 generic 항목을 만들지 않는다. 반대로 source_document:rfp가 있으면 RFP는 확보된 것으로 보고 "RFP 원문 확보", "원문 미확보" 같은 문구를 쓰지 않는다.
    dedupe_rule: writing_loop expansion은 기존 문단과 표를 반복하지 않는다. 이미 쓴 claim/table은 재작성하지 말고 새로운 근거, 누락 row, 리스크, 확인 질문만 추가한다.
    qualification_gate_rule: 소재지·입찰참가자격·공동수급 가능 여부 같은 gate는 일반 리스크가 아니라 참여 가능/불가 판단 항목으로 최상단에 경고한다. source_document에 직접 증빙이 없으면 "충족", "가능", "확인 완료", "확인되나", "가정하고 작성", "조건 충족 시 참여 가능"이라고 쓰지 말고 "미확정 · 제출 전 증빙 수집"으로 쓴다. gate 미확정 항목은 제안 본문에서 충족을 전제로 수행계획을 전개하지 않는다. 특정 지역 소재 기업으로 확인하는 등 회사 상태를 사실로 보이게 하는 문장은 source_document에 사업자등록증·등본 근거가 없으면 실패다.
  artifact_quality_algorithm:
    persona_shift: 작성자는 내부 시스템이 아니라 "오늘 이 입찰을 맡은 고객사 PM"의 자리에서 읽는다. 고객은 시간이 없고, 자격 gate를 놓치면 입찰 자체가 무효가 되며, 근거 없는 강점은 제출 리스크가 된다.
    read_order: 먼저 참여 가능/불가 gate를 판단하고, 그 다음 평가배점상 이길 수 있는지, 그 다음 보완 증빙과 담당자 배정을 판단한다. 문서도 이 순서로 결론을 전개한다.
    evidence_audit: 모든 강점·수치·인력·자격·실적 claim 옆에서 "이걸 증빙 파일로 제출할 수 있나?"를 묻는다. 제출할 수 없으면 확정 문장이 아니라 [제출 전 증빙 수집] 또는 검증 계획으로 쓴다. 인증, 자격증, 전담 조직, 소재지 충족, 유사 실적은 증빙 source가 없는 한 확정하거나 가정하지 않는다.
    source_fact_test: source_document에 날짜·금액·기관명이 있으면 그대로 복사한다. 예를 들어 공고 source에 제안서 접수일시 [접수일시], 발주기관 [발주기관], 기초금액 [기초금액], 추정가격 [추정가격], 공동수급 [공동수급 여부]가 있으면 이를 미확정으로 쓰면 실패다.
    evaluation_fact_test: source_document에 평가배점이 있으면 정량 20점, 정성 60점, 가격 20점을 그대로 분리해 쓴다. 기술능력평가 80점만 쓰고 정량/정성 배점을 누락하면 고객이 준비할 증빙을 놓치므로 실패다.
    gate_language_test: gate 항목은 일반 요구사항 대응과 문체를 분리한다. 기술 요구사항에는 "충족"을 쓸 수 있지만, 본점 소재지·입찰참가자격·면세 여부·공동수급 문맥에서는 source_document 증빙 전까지 "충족 가능성", "확인되나", "충족 시", "참여 가능" 같은 조건부 확정 표현도 쓰지 않는다. 특히 "증빙 확보 시 참여 가능", "참여 가능 여부"라는 문구 자체를 쓰지 않는다. 허용 문구는 "미확정 · 제출 전 증빙 수집", "조건부 검토", "증빙 없이는 참여 판단 불가", "참여 판단 보류"다.
    status_language_test: 요구사항 대응표의 상태 컬럼에는 회사 증빙과 수행 근거가 확인되기 전까지 "확정"을 쓰지 않는다. 허용 상태는 "원문 확인", "대응안", "증빙 확인 필요", "제출 전 보완"이다.
    rfp_source_test: RFP 코드·평가배점·산출물은 원문 근거가 있을 때만 쓴다. source_document:rfp 또는 공고 첨부 근거 없이 R1~R10, 기술 평가 30점, 요구사항 n항 같은 세부 항목을 만들면 고객에게 잘못된 수행계획을 주는 실패다. source_document:rfp가 주입된 run에서는 "RFP 원문 확보 필요"라고 쓰는 것도 실패다.
    customer_action_test: 각 섹션 끝에서 고객이 지금 할 일 1~3개가 보여야 한다. 담당 역할, 필요한 자료, 마감 영향이 없으면 그 문단은 미완성이다.
    duplication_test: 같은 표나 문단이 이미 있으면 다시 쓰지 않는다. 반복 대신 새 row, 누락 리스크, 확인 질문, 의사결정 기준을 추가한다.
    language_test: 제출 검토본은 자연스러운 한국어 제안 문장이어야 한다. 어색한 합성어, 번역투, 외국 문자 혼입, 내부 실행어, 근거 없는 과장어가 보이면 다시 쓴다. 금지어는 "사용하지 않는다"는 설명문, 따옴표, 표 비고, 예시 문맥에서도 출력하지 않는다.
    final_decision_memo: 최종 산출물은 참여 판단, 핵심 gate, 가격 판단, 보완 증빙, 다음 액션이 한눈에 보이는 검토 메모로 읽혀야 한다. gate가 미확정이면 결론은 "조건부 검토"이며, "참여 가능"이나 "충족"으로 끝내지 않는다.
    editorial_coherence_test: 최종본은 sub-agent 산출물 묶음이 아니라 한 명의 제안 PM이 정리한 문서처럼 읽혀야 한다. 같은 제목의 표가 두 번 나오면 뒤 표를 통합하거나 삭제하고, 표 아래 문단은 "무엇을 판단했고, 무엇을 증빙해야 하며, 누가 언제 처리할지"만 남긴다.
    company_data_rag_story_test: 회사 데이터 RAG는 내부 저장소 설명이 아니라 제안 논리다. 좋은 문장은 "회사 데이터 RAG 기반 근거로 요구사항-증빙-리스크를 연결해 평가자가 확인 가능한 제출 자료를 만든다"처럼 고객 이익과 증빙 가능성을 같이 말한다. 나쁜 문장은 "RAG에 있다", "내부 도구명 대신", "고객-facing 표현"처럼 작성 지시를 드러내는 문장이다.
  rfp_response_strategy:
    requirement_classification: RFP 요구사항은 필수(MANDATORY), 배점/정성평가(WEIGHTED), 선호/가점(NICE-TO-HAVE)로 분류한다. 필수 gate가 GAP이면 제안 문체로 덮지 말고 참여 판단 보류로 올린다.
    proof_point_matrix: 회사 적합성은 STRONG/PARTIAL/GAP으로 표시하고, 각 claim은 회사 근거 자료·공고/RFP 근거·제출 증빙 가능 여부를 연결한다. 증빙이 없으면 PARTIAL 또는 GAP이다.
    win_theme_threading: why-us 테마는 최소 2개 이상 RFP 요구사항에 연결될 때만 win-theme로 쓴다. 한 요구사항에만 붙는 문구는 장식 문구로 보고 삭제하거나 해당 요구사항의 대응 문장으로 낮춘다.
    evaluator_benefit_formula: 기능/역량을 단독으로 쓰지 말고 "근거 있는 역량 + 제출 산출물/운영 방식 = 평가자가 얻는 이점"으로 쓴다.
    bid_no_bid_factors: 참여 판단은 자격 gate, 필수 요구사항 GAP, 회사 증빙 보유, 일정 수행 가능성, 가격 시나리오, 관계/현장 정보 부족을 분리해 쓴다. 어느 하나라도 치명 GAP이면 결론은 조건부 검토 또는 참여 판단 보류다.
    competitor_ghosting_rule: 경쟁사명을 직접 쓰거나 비교 우위를 단정하지 않는다. source 근거 없는 경쟁 언급은 "일반 대안" 또는 "외부 솔루션 사례"로 일반화하고, 차별점은 RFP 평가항목과 제출 증빙으로만 설명한다.
    objection_preemption: 가격, 자격, 일정, 증빙 부족, 유사 실적 부족은 숨기지 않고 표에서 먼저 드러낸 뒤 보완 자료와 담당 액션으로 연결한다.
    customer_surface_rule: 고객 제출 검토본에서 회사 데이터 RAG는 중요한 차별점으로 살린다. 다만 "회사 RAG"처럼 내부 도구명만 던지지 말고 "회사 데이터 RAG 기반 근거", "회사 데이터 RAG에 축적된 증빙", "제출 가능한 회사 데이터 RAG 출처"처럼 고객이 이해할 수 있는 근거 체계로 쓴다. 경쟁사명, 외부 커뮤니티명, 출처 없는 인증 보유 단정은 쓰지 않는다. 인증·자격은 증빙 전까지 "제출 전 증빙 수집"으로 표시한다.
    final_editor_rule: 마지막 글은 "요약 → 요구사항 매핑 → 왜 우리인지 → 수행방안 → 일정/RACI → 가격·참여 판단" 순서로만 남긴다. 각 섹션에서 가장 좋은 표는 하나만 남기고, 중복 표·중복 제목·작성 지시문·메타 설명은 삭제한다. 표만 나열하지 말고 고객 결정을 돕는 2~4문장 판단 문단을 붙인다.
    no_invention_rule: 원문 근거가 없는 정확도, 기간, 배점, 경력연수, 지역 실적, 기관 사례, KPI는 쓰지 않는다. 특히 "95%", "12주", "특정 지역 내 공공기관", "RFP 요구사항 n항"은 source_document 직접 근거가 없으면 실패다.
  final_artifact_polish:
    enabled: true
    mode: zodal-humanize-qc
    temperature: 0.1
    timeout_seconds: 180
    instruction: 최종 윤문은 새 작성이 아니라 제안 PM의 편집 단계다. 중복 표·중복 제목·반복 문단·작성 지시문·메타 설명을 삭제하거나 통합하고, 번역투와 내부 실행어를 자연스러운 고객 검토용 문장으로 바꾼다. 사실·숫자·날짜·기관명·공고번호·가격·RFP 코드·자격 gate 문구는 절대 바꾸지 않는다. 새 claim, 새 KPI, 새 인력/자격/실적을 추가하지 않는다. 회사 데이터 RAG는 삭제하지 말고 "요구사항-근거-증빙-리스크를 연결하는 제안 강점"으로 설명한다. "미확정 · 제출 전 증빙 수집", "조건부 검토", "증빙 없이는 참여 판단 불가", "참여 판단 보류" 문구는 그대로 보존한다.
  artifact_revision_mode:
    enabled: true
    mode: chat-like-continuous-polish
    artifact_prompt_section: volatile
    temperature: 0.1
    timeout_seconds: 180
    max_input_chars: 32000
    previous_artifact_prefixes:
      - "draft_artifact:"
      - "previous_artifact:"
      - "artifact_draft:"
    feedback_prefixes:
      - "user_feedback:"
      - "revision_request:"
      - "edit_request:"
    instruction: 후속 피드백이 들어오면 전체 sub-agent 작성 과정을 다시 반복하지 말고, 직전 markdown 검토본을 기준으로 채팅 편집자처럼 계속 다듬는다. 고객이 말한 보완점은 본문에 바로 반영하되, 공고/RFP 사실·가격·자격 gate·마감일·증빙 상태는 source_fact_table과 source_document 근거를 우선한다. 중복 표와 중복 제목은 하나로 통합하고, 수정 결과는 변경 로그가 아니라 바로 제출 전 검토본으로 읽혀야 한다.
  qc_revision_loop:
    enabled: true
    max_passes: 2
    instruction: QC가 HOLD 또는 PROCEED_WITH_FIXES이면 findings를 섹션에 반영한 뒤 같은 품질 기준으로 다시 검수한다. 두 번째 QC도 HOLD이면 최종 리포트에 HOLD를 유지한다.
  artifact_quality_checks:
    reconcile_qc_on_final_pass: true
    max_phrase_count: 1
    required_patterns:
      - name: unresolved_gate_marker
        pattern: 미확정 · 제출 전 증빙 수집
      - name: conditional_review_marker
        pattern: (조건부 검토|참여 판단 보류)
        fallback_text: "결론: 조건부 검토"
    duplicate_phrases:
      - text: 제출 전 검수 체크리스트
        replacement: 제출 전 확인사항
      - text: RFP 요구사항 추적 및 대응 매트릭스
        replacement: RFP 요구사항 보완 매트릭스
      - text: 회사 데이터 RAG 근거 및 적합도 매트릭스
        replacement: 회사 데이터 RAG 보완 근거
      - text: 회사 데이터 RAG 기반 근거 및 적합도 매트릭스
        replacement: 회사 데이터 RAG 보완 근거
      - text: 과업별 수행방안 및 산출물 매핑
        replacement: 과업별 수행방안
      - text: 추진일정 Gantt
        replacement: 추진일정
    rewrite_patterns:
      - name: remove_price_forbidden_phrase
        pattern: 낙찰가 최저점
        replacement: 가격평가 최저점
      - name: gate_participation_to_hold
        pattern: (증빙 확보 시 참여 가능|참여 가능 여부|\"참여 가능\")
        replacement: 참여 판단 보류
      - name: gate_participation_possible_sentence_to_hold
        pattern: 증빙 확보 시 참여 판단이 가능(합니다|하다|하다고 판단됩니다)?
        replacement: 증빙 없이는 참여 판단 불가
      - name: conditional_participation_possible_to_hold
        pattern: 참여가 가능(하나|합니다|하다|하다고 판단됩니다)?
        replacement: 참여 판단 보류
      - name: conditional_qualification_participation_to_hold
        pattern: 충족할 경우 참여가 가능하다
