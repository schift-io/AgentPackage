      - name: unproven_company_case_claim
        pattern: (실제 운영 환경|기존 고객사|표준화하고|구축 경험 보유|알고리즘 기반을 보유)
      - name: price_basis_confusion
        pattern: 추정가격 \[추정가격\] 대비 \[비율\]
      - name: internal_product_name_customer_facing
        pattern: (Schift Agent Hub|Schift RAG|Schift OCR|Agent Hub|RAG bucket|\bSchift\b)
      - name: internal_org_name_customer_facing
        pattern: (\b[Rr][Oo][Oo][Mm]821\b|룸821)
