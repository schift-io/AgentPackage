      - name: over_specific_gyeongbuk_address
        pattern: 특정 지역 도시명
      - name: qualification_confirmation
        pattern: 충족함을 명시
      - name: vendor_specific_model_name
        pattern: 오픈AI(의)? GPT
      - name: unsupported_rfp_code_drift
        pattern: 공고문 RFP 요구사항 (9|10)항
      - name: generic_rfp_range
        pattern: RFP 요구사항 (1~4항|\(R1~R4\))
      - name: generic_rfp_requirement
        pattern: 공고문 RFP 요구사항 [0-9]+항
      - name: missing_source_but_detailed_plan
        pattern: (RFP 원문 확보|RFP 원문을 확보|\| 발주기관 \| 미확정|\| 공고명 \| 미확정|\| 입찰마감 \| 미확정)
      - name: source_fact_missed_or_typo
        pattern: (추정가격 90,909,09원|낙찰가 최저점)
