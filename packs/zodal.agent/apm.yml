        pattern: '#[Ff][Ff]4[Dd]00'
      - name: meta_instruction_leak
        pattern: (내부 도구명|내부 개발 도구명|customer-facing|고객-facing 표현)
      - name: repeated_table_title_leak
        pattern: (RFP 요구사항 추적 및 대응 매트릭스[\s\S]{0,2500}RFP 요구사항 추적 및 대응 매트릭스|회사 데이터 RAG 근거 및 적합도 매트릭스[\s\S]{0,2500}회사 데이터 RAG 근거 및 적합도 매트릭스)
