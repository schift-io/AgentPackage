name: room821-reels-agent
display_name: "Room821 Reels Agent"
version: 0.1.3
description: Reels/Shorts APM that prepares template-based vertical videos with approval checkpoints.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한, 실행은 allowed_orgs 가 별도 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: public
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=False)과 바이트 동일.
pipeline: fanout

agents:
  - id: room821/reels.agent/agent.md
    path: apm/reels.agent/agent.md

skills:
  - id: room821/skills/reels-storyboard-writer
    path: apm/reels.agent/skills/reels-storyboard-writer/SKILL.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

awp_operations:
  - id: reels-template-video
    contract_version: awp.reels.template_video.v1
    purpose: Build an approval-ready vertical Reels/Shorts packet from a source topic, media policy, captions, TTS, BGM, and render constraints.
    approval_required: true
    host_route: /v1/agents/reels/operations/reels-template-video/runs
    render_worker:
      binding: schift.reels.remotion-renderer.v1
      engine: remotion
      composition_id: SchiftReelsTemplate
      job_route: /v1/sessions/{session_id}/reels/render-jobs
      ffmpeg_role: final_mux_and_encoding

runtime_boundary:
  apm_owns:
    - user_intent_routing
    - awp_selection
    - approval_summary
    - ambiguity_resolution
    - media_source_choice
  awp_owns:
    - scene_storyboard_schema
    - vertical_safe_area_rules
    - caption_timing_policy
    - tts_bgm_render_packet
    - usage_metering_events
    - image_search_result_logging
  host_services_only:
    - auth
    - source_upload_storage
    - image_search_connector
    - image_generation_connector
    - tts_connector
    - bgm_asset_connector
    - render_worker
    - usage_ledger
    - run_persistence
  forbidden_host_policy:
    - caption_rewrite_prompt
    - scene_order_decision
    - safe_area_text_policy
    - media_reuse_policy
    - billing_metering_policy

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
document_hierarchy:
  kind: "reels"
  title: "릴스/쇼츠 영상 초안"
  description: "인스타 릴스·유튜브 쇼츠용 9:16 템플릿 영상 계획"
  format:
    canvas:
      width: 1080
      height: 1920
      aspect_ratio: "9:16"
    fps: 30
    safe_area:
      top_px: 220
      bottom_px: 320
      left_px: 72
      right_px: 72
      caption_zone: "center"
  awp_operation: "reels-template-video"
  contract_version: "awp.reels.template_video.v1"
  sections:
    - id: "1"
      title: "훅과 목표"
      description: "첫 2초 훅, 끝까지 남길 메시지, 과장 금지선"
    - id: "2"
      title: "장면 storyboard"
      description: "장면별 길이, 배경, black zone, 중앙 캡션, 모션"
    - id: "3"
      title: "이미지와 자막"
      description: "기본 이미지 검색, 업로드/생성 대체안, image_db 저장 필드"
    - id: "4"
      title: "오디오와 렌더"
      description: "TTS, BGM, mp4 렌더 packet, 라이브 사용량 이벤트"
  media_policy:
    default_source: "image_search"
    alternate_sources:
      - "upload"
      - "image_generation"
    search_results_persist_to: "image_db"
    generation_model_default: "gpt-image-2"
    generation_quality_default: "medium"
  usage_metering:
    mode: "live"
    events:
      - "llm_tokens"
      - "image_search_query"
      - "image_search_result_saved"
      - "image_generation"
      - "tts_seconds"
      - "bgm_asset"
      - "render_seconds"
sub_agent_plan:
  - id: "reels-script-agent"
    name: "Reels Script Agent"
    role: "훅, 핵심 메시지, 장면 순서를 만든다."
    owns_sections:
      - "1"
      - "2"
    generation:
      max_tokens: 2400
      temperature: 0.45
  - id: "reels-media-caption-agent"
    name: "Reels Media Caption Agent"
    role: "이미지 검색/업로드/생성 선택지와 safe-area 중앙 캡션을 만든다."
    owns_sections:
      - "3"
    generation:
      max_tokens: 2200
      temperature: 0.35
  - id: "reels-audio-render-agent"
    name: "Reels Audio Render Packet Agent"
    role: "TTS, BGM, 렌더 packet과 사용량 이벤트를 정리한다."
    owns_sections:
      - "4"
    generation:
      max_tokens: 1800
      temperature: 0.25
artifacts:
  html_artifact_title: "릴스/쇼츠 영상 초안.html"
  markdown_artifact_title: "릴스/쇼츠 영상 초안.md"
  visual_assets_enabled: true
