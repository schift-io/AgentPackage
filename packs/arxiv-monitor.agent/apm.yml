name: schift-arxiv-monitor-agent
display_name: "Schift arXiv Monitor Agent"
version: 0.1.4
description: Schift research-interest arXiv monitoring & periodic briefing agent package (베타). Finds new arXiv papers for tracked research interests and builds a cron-deliverable briefing, deduped against what was already reported.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: private
owner_org: org_room821
# news-monitor.agent/apm.yml과 동일 선언적 pipeline 패턴 — 무동작 변경.
pipeline: fanout

agents:
  - id: schift/arxiv-monitor.agent/agent.md
    path: apm/arxiv-monitor.agent/agent.md

skills:
  - id: schift/skills/arxiv-brief
    path: apm/arxiv-monitor.agent/skills/arxiv-brief/SKILL.md
  - id: schift/skills/inject-current-date
    runtime: inject-current-date   # 현재 KST 날짜 주입 (신규성 판정 grounding)
  - id: schift/skills/arxiv-fetch
    runtime: arxiv-fetch   # 결정적 arXiv API 적재 (LLM tool-call 의존 제거, 환각 방지)
  - id: room821/skills/schift-memory
    runtime: schift-memory

# 정기 브리핑은 Cloud Scheduler(X-Cron-Secret) → API 엔드포인트가 이 팩을
# 관심사 셋으로 1회 실행한 뒤 결과를 브리핑으로 노출한다. (news-monitor와 동일 경로)
delivery:
  mode: api_digest
  cron_via: cloud_scheduler
  consumer: phedy

knowledge:
  # 발견=arXiv API 초록(summary) 전문. 본문 PDF 전체 RAG 적재는 승격 단계로 미룸.
  retrieval_required: false

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
document_hierarchy:
  template_id: "schift_arxiv_briefing_v1"
  title: "arXiv 브리핑"
  kind: "document"
  delivery:
    mode: "api_digest"
    cron_via: "cloud_scheduler"
    consumer: "phedy"
  knowledge:
    retrieval_required: false
    source_strategy: "arxiv_api_only"
  sections:
    - id: "1"
      title: "모니터링 조건"
      prompt: "추적 관심 분야 목록(연구 주제·기술 키워드)을 한 줄로 요약한다. 관심 분야가 비어 있으면 사용자에게 무엇을 지켜볼지 한 줄로 묻는다."
    - id: "2"
      title: "관심 분야별 신규 논문"
      prompt: "오직 세션에 주입된 `source_document:arxiv:` 메모리(arxiv-fetch 그라운딩이 arXiv API로 결정적으로 적재한 JSON)만 근거로 사용한다. 각 관심 분야마다 그 안의 논문을 [제목](abs_url)·저자·published·초록 기반 요약 3~5줄로 정규화한다. 같은 논문의 개정판은 최신 버전 1건으로 묶는다. **주입된 논문 외에는 어떤 제목·저자·결과도 절대 지어내지 않는다.** `source_document:arxiv:error`/`empty` 또는 주입 논문이 0건이면 해당 관심 분야는 '신규 논문 없음(수집 실패 또는 0건)'으로만 적고, 예시 논문을 만들지 않는다."
    - id: "3"
      title: "주목 논문"
      prompt: "같은 관심 분야에 신규 논문이 몰리거나 방법론적으로 눈에 띄는 논문을 최상단 하이라이트로 뽑는다. 없으면 '특이사항 없음'."
    - id: "4"
      title: "신규 요약 통계"
      prompt: "관심 분야별 신규 논문 건수를 표로 정리한다."
    - id: "5"
      title: "사람 확인 필요"
      prompt: "본문(PDF) 확인이 필요한 항목, 초록만으로 판단이 애매한 것만 모은다."
non_runnable_agent_ids:
  - "arxiv-review-agent"
sub_agent_plan:
  - id: "arxiv-intake-agent"
    name: "Intake Agent"
    owns_sections:
      - "1"
    purpose: "관심 분야 셋을 검색 단위로 정리하고 비어 있으면 사용자에게 묻는다."
    required_memory:
      - "document_hierarchy"
    output: "research_interests"
    generation:
      max_tokens: 1500
      temperature: 0.2
      timeout_seconds: 120
  - id: "arxiv-collect-agent"
    name: "Collect Agent"
    owns_sections:
      - "2"
    purpose: "arXiv API로 관심 분야별 신규 논문을 모아 신규성·중복(개정판)을 정리한다."
    required_memory:
      - "document_hierarchy"
      - "research_interests"
    output: "interest_papers"
    generation:
      max_tokens: 3600
      temperature: 0.1
      timeout_seconds: 240
  - id: "arxiv-briefing-agent"
    name: "Briefing Agent"
    owns_sections:
      - "3"
      - "4"
    purpose: "수집 논문을 주목 논문으로 하이라이트하고 신규 통계를 정리해 브리핑으로 만든다."
    required_memory:
      - "document_hierarchy"
      - "research_interests"
      - "interest_papers"
    output: "arxiv_briefing"
    generation:
      max_tokens: 4096
      temperature: 0.2
      timeout_seconds: 240
  - id: "arxiv-review-agent"
    name: "Review Agent"
    owns_sections:
      - "5"
    purpose: "본문 확인 필요·판단 애매 항목을 사람 확인용으로 남긴다."
    required_memory:
      - "document_hierarchy"
    output: "human_review"
    generation:
      max_tokens: 0
      temperature: 0.0
      timeout_seconds: 0
artifacts:
  html_artifact_title: "arXiv 브리핑.html"
  markdown_artifact_title: "arXiv 브리핑.md"
