# tools: compile_image_prompt(순수 컴파일+검증, 과금 없음) + generate_image(기존
# image_service 경로, 검증 통과 후에만 호출). 둘 다 ALLOWED_TOOLS 화이트리스트에 등록됨.
tools:
  - name: compile_image_prompt
    description: >-
      요청+한국어 원본 카테고리/룩/해상도/타깃모델을 원본 hwabo 규칙과 선택된
      라우터 레퍼런스에 맞춰 컴파일하고 검증한다(생성/과금 없음). args: request(필수), category?(C1-C12),
      look_preset?, resolution_id?, target_model?(gpt-image-2|higgsfield|
      z-image-turbo), background?, palette?([HEX,...]), text_in_image?.
  - name: generate_image
    description: >-
      compile_image_prompt가 돌려준 compiled_prompt/api_size로 실제 이미지를
      생성한다. args: prompt(필수, compiled_prompt 그대로), size(api_size 그대로).

awp_operations:
  - id: image-gen
    contract_version: awp.image_gen.compile_generate.v1
    purpose: >-
      요청을 gongnyang 한국어 원본 hwabo 프롬프트로 컴파일·검증하고, 승인 후
      gpt-image-2로 생성한다. 이미지당 raw-COGS CR 과금(pricing.py, GO 대기).
    approval_required: true
    host_route: /v1/agents/image-gen/operations/image-gen/runs
    image_model:
      default: gpt-image-2   # image_service.DEFAULT_MODEL — env GPT_IMAGE_MODEL로 오버라이드
      adapter_env: GPT_IMAGE_MODEL
      # cost_usd는 image_service.estimate_image_cost_usd(model,size,quality)가
      # 실행마다 산출 — 하드코딩 상수 아님. CR 환산 rate는 PRICING.md/pricing.py
      # GO 확정 전까지 코드 미반영(§ CR 과금 절 참조).
      cost_basis: raw_cogs_per_image
      billing_status: rate_pending_go
    agentic_refine:
      enabled: true
      default_max_iterations: 2
      quality_threshold: 0.75
      critique_source: multimodal_llm  # 런타임 주입, 이 팩이 모델을 호출하지 않음

runtime_boundary:
  apm_owns:
    - user_intent_routing
    - awp_selection
    - approval_summary
    - ambiguity_resolution
    - target_model_choice
    - refine_iteration_offer
  awp_owns:
    - category_taxonomy_c1_c12
    - format_a_b_selection
    - model_profile_axis_weighting
    - ar_trailing_token_rule
    - palette_and_negative_validation
    - usage_metering_events
  host_services_only:
    - auth
    - image_generation_connector   # image_service.generate_and_store (gpt-image-2, R2 스테이징)
    - multimodal_critique_scorer   # agentic_refine 루프의 critique_fn 주입처
    - usage_ledger
    - run_persistence
  forbidden_host_policy:
    - category_taxonomy_definition
    - model_profile_axis_weighting
    - validation_whitelist_policy
    - billing_metering_policy

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
document_hierarchy:
  template_id: "room821_image_gen_v1"
  title: "이미지 생성 패킷"
  kind: "document"
  knowledge:
    retrieval_required: false
    source_strategy: "none"
  sections:
    - id: "1"
      title: "요청 파악"
      prompt: "자연어 요청 + (있으면) 카테고리/룩 프리셋/해상도/타깃 모델/배경/HEX 팔레트/이미지 내 텍스트를 정리한다."
    - id: "2"
      title: "컴파일"
      prompt: "compile_image_prompt 툴을 호출해 compiled_prompt/format/ar/api_size/validation을 받는다. 직접 프롬프트를 재작성하지 않는다."
    - id: "3"
      title: "검증 게이트"
      prompt: "validation.passed=false면 hard_fails를 설명하고 생성을 진행하지 않는다. warnings는 표시만 하고 진행 가능."
    - id: "4"
      title: "승인 + 생성"
      prompt: "compiled_prompt/api_size/예상 크레딧을 요약해 승인받고 generate_image를 호출한다."
    - id: "5"
      title: "[선택] 에이전틱 보정"
      prompt: "사용자가 다듬기를 요청하거나 text-in-image 결과면 자가비평 -> 리파인 -> 재생성 루프를 제안한다(최대 2회)."
artifacts:
  markdown_title: "이미지 생성 검토본"
  html_artifact_title: "이미지 생성 검토본.html"
  markdown_artifact_title: "이미지 생성 검토본.md"
  visual_assets_enabled: true
