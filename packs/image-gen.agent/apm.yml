name: room821-image-gen-agent
version: 0.2.0
description: >-
  이미지 생성 APM. gongnyang-prompt-kit V2.4의 한국어 hwabo 원본과 라우터 레퍼런스를
  채택하고, 멀티모델(gpt-image-2/higgsfield/z-image-turbo) 프로파일을 결합한다.
  기존 영어 taxonomy와는 0.2.0에서 단절된다. 요청 -> compile_image_prompt(순수함수,
  한국어 C1-C12/Format A-B/AR-끝/HEX/검증) -> 승인 -> generate_image(기존
  image_service, gpt-image-2) -> [선택] 자가비평 보정 루프.
extends: ../runtime.yml
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True, sub_agent_plan=[])과 바이트 동일.
pipeline: react
access_scope: org  # owner_org_id=org_room821 — 도그푸드 전용, ad-creative와 동일 게이팅

agents:
  - id: room821/image-gen.agent/agent.md
    path: apm/image-gen.agent/agent.md

skills:
  - id: room821/skills/image-prompt-compiler
    path: apm/image-gen.agent/skills/prompt-compiler/SKILL.md
    references:
      - apm/image-gen.agent/skills/prompt-compiler/references/categories-and-formats.md
      - apm/image-gen.agent/skills/prompt-compiler/references/model-profiles.md
      - apm/image-gen.agent/skills/prompt-compiler/references/validation-rules.md
      - apm/image-gen.agent/skills/prompt-compiler/references/concept-axes.md
      - apm/image-gen.agent/skills/prompt-compiler/references/editorial-hwabo.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typography-layout.md
      - apm/image-gen.agent/skills/prompt-compiler/references/style-taxonomy.md
      - apm/image-gen.agent/skills/prompt-compiler/references/photo-vocab.md
      - apm/image-gen.agent/skills/prompt-compiler/references/look-presets.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster-router.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP1-photo-mask.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP2-text-tunnel.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP3-type-architecture.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP4-optical-type.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP5-tactile-destruction.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP6-swiss-kinetic.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP7-material-sculpt.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP8-liquid-chrome.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP9-inflatable.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP10-opart-pattern.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP11-acid-graphics.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP12-future-medieval.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP13-anamorphic.md
      - apm/image-gen.agent/skills/prompt-compiler/references/typo-poster/TP14-micrography.md
      - apm/image-gen.agent/skills/prompt-compiler/references/promo-router.md
      - apm/image-gen.agent/skills/prompt-compiler/references/promo/P1-typomask.md
      - apm/image-gen.agent/skills/prompt-compiler/references/promo/P2-typo-env.md
      - apm/image-gen.agent/skills/prompt-compiler/references/promo/P3-crop-occlusion.md
      - apm/image-gen.agent/skills/prompt-compiler/references/promo/P4-color-campaign.md
      - apm/image-gen.agent/skills/prompt-compiler/references/promo/P5-meta-ui.md
