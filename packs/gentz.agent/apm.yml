name: gentz-bakery-agent
display_name: "Gentz Bakery Agent"
version: 0.1.4
description: 겐츠베이커리 고객 챗봇. 매장·메뉴·시즌·후기는 RAG, 알레르기는 식약처 전성분 기반 결정적 조회.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: private
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True, sub_agent_plan=[])과 바이트 동일.
pipeline: react

agents:
  - id: gentz/gentz.agent/agent.md
    path: apm/gentz.agent/agent.md

skills:
  - id: gentz/skills/gentz-qa
    path: apm/gentz.agent/skills/gentz-qa/SKILL.md
  - id: gentz/skills/allergy-check
    path: apm/gentz.agent/skills/allergy-check/SKILL.md
    runtime: gentz-allergy
  - id: room821/skills/schift-memory
    runtime: schift-memory

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
access_scope: "org"
document_hierarchy:
  template_id: "gentz_chatbot_v1"
  title: "겐츠 고객 챗봇"
  kind: "chat"
  knowledge:
    retrieval_required: true
    bucket_id: "2b2702e0474e4c5a92e7c9840ea80b94"
    bucket_name: "gentz-bakery"
    bucket_hint: "gentz-bakery"
    source_strategy: "bucket_rag"
artifacts:
  markdown_title: "겐츠 고객 응답"
  html_artifact_title: "겐츠 고객 응답.html"
  markdown_artifact_title: "겐츠 고객 응답.md"
