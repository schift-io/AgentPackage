name: schift-news-monitor-agent
display_name: "Schift News Monitor Agent"
version: 0.1.3
description: Schift keyword news monitoring & periodic briefing agent package (베타). Finds Korean+global news for tracked keywords from official/press sources and builds a cron-deliverable daily briefing, deduped against what was already reported.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: private
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True지만 runnable
# sub-agent도 있어 fan-out 유지, in-loop 툴 근거수집 W2b)과 바이트 동일.
pipeline: fanout

agents:
  - id: schift/news-monitor.agent/agent.md
    path: apm/news-monitor.agent/agent.md

skills:
  - id: schift/skills/news-brief
    path: apm/news-monitor.agent/skills/news-brief/SKILL.md
  - id: schift/skills/inject-current-date
    runtime: inject-current-date   # 현재 KST 날짜 주입 (신규성·속보 판정 grounding)
  - id: schift/skills/news-fetch
    runtime: news-fetch   # 결정적 네이버 뉴스 적재 (LLM tool-call 의존 제거, 환각 방지)
  - id: room821/skills/schift-memory
    runtime: schift-memory

# 정기 브리핑은 Cloud Scheduler(X-Cron-Secret) → API 엔드포인트가 이 팩을
# 키워드 셋으로 1회 실행한 뒤 결과를 브리핑으로 노출한다. (scholarship과 동일 경로)
delivery:
  mode: api_digest
  cron_via: cloud_scheduler
  consumer: phedy

knowledge:
  # MVP(PoC)는 라이브 웹검색(research_queries) 그라운딩만 — 발견은 제목+요약 스니펫.
  # "새 기사만" diff + 본문 RAG가 필요해지면 승격: 발견=네이버 뉴스 검색 API,
  # 본문=website-crawler/ingest 파이프라인으로 originallink 후처리 → 버킷 적재.
  # (남들은 이 본문 추출 자리에 Firecrawl을 붙이지만 우리는 자체 ingest로 메운다.)
  retrieval_required: false

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
document_hierarchy:
  template_id: "schift_news_briefing_v1"
  title: "뉴스 브리핑"
  kind: "document"
  delivery:
    mode: "api_digest"
    cron_via: "cloud_scheduler"
    consumer: "phedy"
  knowledge:
    retrieval_required: false
    source_strategy: "naver_news_api_then_crawler_bucket"
  research_queries:
    - "tracked keyword latest news today global coverage"
    - "키워드 관련 최신 속보 공식 발표 보도자료"
  sections:
    - id: "1"
      title: "모니터링 조건"
      prompt: "추적 키워드 목록(브랜드·경쟁사·업종·인물·종목)을 한 줄로 요약한다. 키워드가 비어 있으면 사용자에게 무엇을 지켜볼지 한 줄로 묻는다."
    - id: "2"
      title: "키워드별 신규 뉴스"
      prompt: "오직 세션에 주입된 `source_document:news:` 메모리(news-fetch 그라운딩이 네이버 API로 결정적으로 적재한 JSON)만 근거로 사용한다. 각 키워드마다 그 안의 기사를 [제목](originallink)·pubDate·스니펫 요약 3~5줄로 정규화한다. 같은 사건 중복은 가장 원본/공식 1건으로 묶고 '외 N건'. **주입된 기사 외에는 어떤 제목·매체·수치도 절대 지어내지 않는다.** `source_document:news:error`/`empty` 또는 주입 기사가 0건이면 해당 키워드는 '신규 기사 없음(수집 실패 또는 0건)'으로만 적고, 예시 기사를 만들지 않는다."
    - id: "3"
      title: "주목 이슈"
      prompt: "같은 키워드에 단시간 다수 매체 보도가 몰린 속보/집중 이슈를 최상단 하이라이트로 뽑는다. 없으면 '특이사항 없음'."
    - id: "4"
      title: "신규 요약 통계"
      prompt: "키워드별 신규 기사 건수와 묶인 중복 수를 표로 정리한다."
    - id: "5"
      title: "사람 확인 필요"
      prompt: "본문 확인이 필요한 항목(originallink), 미검증 출처, 스니펫만으로 판단이 애매한 것만 모은다. 본문 전문 RAG 적재는 승격 단계(website-crawler/ingest) 작업으로 표기한다."
non_runnable_agent_ids:
  - "news-review-agent"
sub_agent_plan:
  - id: "news-intake-agent"
    name: "Intake Agent"
    owns_sections:
      - "1"
    purpose: "추적 키워드 셋을 검색 단위로 정리하고 비어 있으면 사용자에게 묻는다."
    required_memory:
      - "document_hierarchy"
    output: "tracked_keywords"
    generation:
      max_tokens: 1500
      temperature: 0.2
      timeout_seconds: 120
  - id: "news-collect-agent"
    name: "News Collect Agent"
    owns_sections:
      - "2"
    purpose: "네이버 뉴스 검색 API로 키워드별 최신 기사를 모아 신규성·중복을 정리한다."
    required_memory:
      - "document_hierarchy"
      - "tracked_keywords"
    output: "keyword_news"
    generation:
      max_tokens: 3600
      temperature: 0.1
      timeout_seconds: 240
  - id: "news-briefing-agent"
    name: "Briefing Agent"
    owns_sections:
      - "3"
      - "4"
    purpose: "수집 기사를 주목 이슈로 하이라이트하고 신규 통계를 정리해 브리핑으로 만든다."
    required_memory:
      - "document_hierarchy"
      - "tracked_keywords"
      - "keyword_news"
    output: "news_briefing"
    generation:
      max_tokens: 4096
      temperature: 0.2
      timeout_seconds: 240
  - id: "news-review-agent"
    name: "Review Agent"
    owns_sections:
      - "5"
    purpose: "본문 확인 필요·미검증 출처·애매 항목을 사람 확인용으로 남긴다."
    required_memory:
      - "document_hierarchy"
    output: "human_review"
    generation:
      max_tokens: 0
      temperature: 0.0
      timeout_seconds: 0
artifacts:
  html_artifact_title: "뉴스 브리핑.html"
  markdown_artifact_title: "뉴스 브리핑.md"
