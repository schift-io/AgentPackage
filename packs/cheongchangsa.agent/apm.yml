name: schift-cheongchangsa-agent
display_name: "Schift Cheongchangsa Evidence Review Agent"
version: 0.2.4
description: Schift Cheongchangsa Discord evidence review and execution packet agent package.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: private
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=False)과 바이트 동일.
pipeline: fanout

agents:
  - id: schift/cheongchangsa.agent/agent.md
    path: apm/cheongchangsa.agent/agent.md

skills:
  - id: schift/skills/cheongchangsa-document-prep
    path: apm/cheongchangsa.agent/skills/document-prep/SKILL.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

discord:
  install_mode: oauth2_application_install
  bot_token_env: SCHIFT_DISCORD_CHEONGCHANGSA_BOT_TOKEN
  webhook_env: SCHIFT_DISCORD_CHEONGCHANGSA_WEBHOOK_URL
  channel_id_env: SCHIFT_DISCORD_CHEONGCHANGSA_CHANNEL_ID
  commands:
    - name: ai-usage
      ko_name: ai사용비-집행
      awp_operation: cheongchangsa.ai_usage_execution
    - name: payroll
      ko_name: 인건비-집행
      awp_operation: cheongchangsa.payroll_execution
    - name: ads
      ko_name: 광고비-집행
      awp_operation: cheongchangsa.ads_execution
    - name: evidence-review
      ko_name: 증빙검토
      awp_operation: cheongchangsa.evidence_review
    - name: submission-bundle
      ko_name: 제출패키지생성
      awp_operation: cheongchangsa.submission_bundle

knowledge:
  bucket_id: 43c25d14931e42828c3c6cbba469b550
  bucket_name: chungchangsa-2026-execution-manual
  bucket_role: canonical_manual
  retrieval_required: true
  # pre-run 매뉴얼 grounding은 command별 관련 쿼리만 핸들러가 골라서 한다
  # (cheongchangsa_assets.CHEONGCHANGSA_RETRIEVAL_QUERIES). flat 목록을 두면 매 런
  # 전부(~7,700자) 끌어와 무관 근거가 섞이므로 두지 않는다.
  source:
    kind: pdf
    title: 2026년 창업성공패키지(청년창업사관학교) 사업비 집행 매뉴얼 0601개정
    local_path: /Users/jskang/Downloads/★2026년 창업성공패키지(청년창업사관학교) 사업비 집행 매뉴얼_0601개정.pdf
    ingest_metadata:
      bucket_id: 43c25d14931e42828c3c6cbba469b550
      bucket_name: chungchangsa-2026-execution-manual
      program: 청년창업사관학교
      year: "2026"
      document_type: business_expense_execution_manual
      source_scope: chungchangsa_evidence_review

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
access_scope: "org"
document_hierarchy:
  template_id: "schift_cheongchangsa_evidence_review_bot_v2"
  title: "청창사 증빙 검토"
  kind: "document"
  channel:
    type: "discord"
    install_mode: "oauth2_application_install"
    bot_token_env: "SCHIFT_DISCORD_CHEONGCHANGSA_BOT_TOKEN"
    webhook_env: "SCHIFT_DISCORD_CHEONGCHANGSA_WEBHOOK_URL"
    channel_id_env: "SCHIFT_DISCORD_CHEONGCHANGSA_CHANNEL_ID"
    commands:
      - name: "ai-usage"
        ko_name: "ai사용비-집행"
        awp_operation: "cheongchangsa.ai_usage_execution"
      - name: "payroll"
        ko_name: "인건비-집행"
        awp_operation: "cheongchangsa.payroll_execution"
      - name: "ads"
        ko_name: "광고비-집행"
        awp_operation: "cheongchangsa.ads_execution"
      - name: "evidence-review"
        ko_name: "증빙검토"
        awp_operation: "cheongchangsa.evidence_review"
      - name: "submission-bundle"
        ko_name: "제출패키지생성"
        awp_operation: "cheongchangsa.submission_bundle"
  knowledge:
    bucket_id: "43c25d14931e42828c3c6cbba469b550"
    bucket_name: "chungchangsa-2026-execution-manual"
    bucket_role: "canonical_manual"
    source_title: "2026년 창업성공패키지(청년창업사관학교) 사업비 집행 매뉴얼 0601개정"
    retrieval_required: true
  research_queries:
    - "AI 사용비 집행 필수 증빙 invoice receipt 카드전표 해외승인 사용사진"
    - "인건비 집행 필수 증빙 송금 확인증 급여 지급 근거 원천세 4대보험"
    - "사업비 사용내역서 작성 항목 금액 날짜 승인번호 공급처"
  sections:
    - id: "1"
      title: "접수 요약"
      prompt: "Discord 명령어, 메시지, 작성자, 첨부 파일명, 요청 목적을 간단히 정리한다."
    - id: "2"
      title: "작업 유형과 매뉴얼 근거"
      prompt: "AI 사용비, 인건비, 증빙검토, 제출패키지 중 작업 유형을 정하고 청창사 매뉴얼 RAG 근거를 붙인다."
    - id: "3"
      title: "첨부 파일 확인"
      prompt: "파일별 종류, 읽을 수 있는 범위, 추출 가능한 항목, 실패/미지원 항목을 분리한다."
    - id: "4"
      title: "증빙 충족/누락"
      prompt: "청창사 제출에 필요한 항목을 문서별로 정리하고 원본에서 확인된 값과 누락 값을 나눈다."
    - id: "5"
      title: "Discord 회신"
      prompt: "채널에 보낼 짧은 답장을 작성한다. 받은 것, 처리 상태, 다음에 필요한 것만 포함한다."
    - id: "6"
      title: "제출 전 검수"
      prompt: "사람이 제출 전에 확인해야 하는 위험 항목, 원본 대조, 서명/날인/금액/날짜 확인을 정리한다."
non_runnable_agent_ids:
  - "cheongchangsa-review-agent"
qc_enabled: true
sub_agent_plan:
  - id: "cheongchangsa-intake-agent"
    name: "Intake Agent"
    owns_sections:
      - "1"
      - "3"
    purpose: "Discord 메시지와 첨부 파일을 접수 단위로 정리한다."
    required_memory:
      - "document_hierarchy"
    output: "intake_and_attachments"
    generation:
      max_tokens: 3000
      temperature: 0.2
      timeout_seconds: 180
  - id: "cheongchangsa-manual-rag-agent"
    name: "Manual RAG Agent"
    owns_sections:
      - "2"
    purpose: "청창사 매뉴얼 버킷을 검색해 작업 유형별 증빙 판단 근거를 확보한다."
    required_memory:
      - "document_hierarchy"
      - "chungchangsa_manual_bucket:43c25d14931e42828c3c6cbba469b550"
    output: "manual_evidence_context"
    generation:
      max_tokens: 2400
      temperature: 0.1
      timeout_seconds: 180
  - id: "cheongchangsa-document-agent"
    name: "Document Agent"
    owns_sections:
      - "4"
    purpose: "서류별 확인 값과 누락 값을 분리해 제출 준비 목록을 만든다."
    required_memory:
      - "document_hierarchy"
      - "manual_evidence_context"
    output: "document_requirements"
    generation:
      max_tokens: 4096
      temperature: 0.2
      timeout_seconds: 240
  - id: "cheongchangsa-reply-agent"
    name: "Reply Agent"
    owns_sections:
      - "5"
    purpose: "Discord 채널에 보낼 짧은 상태 답장을 작성한다."
    required_memory:
      - "document_hierarchy"
    output: "discord_reply"
    generation:
      max_tokens: 1200
      temperature: 0.2
      timeout_seconds: 120
  - id: "cheongchangsa-review-agent"
    name: "Review Agent"
    owns_sections:
      - "6"
    purpose: "제출 전 사람이 확인할 검수 항목을 남긴다."
    required_memory:
      - "document_hierarchy"
    output: "human_review"
    generation:
      max_tokens: 0
      temperature: 0.0
      timeout_seconds: 0
variants:
  evidence_review:
    router_requires_attachment: true
    router_session_scope: "throwaway"
    router_handler: "agent_hub.router_handlers.cheongchangsa:run_evidence_review"
    router_description: "첨부된 증빙 파일(영수증·카드전표·인보이스·통장사본·급여대장·사용내역서 등)을 청창사 매뉴얼 근거로 누락/불일치 검토하고 제출 준비. 파일이 첨부됐을 때."
  manual_qa:
    router_topic_hints:
      - "청창사"
      - "cheongchangsa"
      - "증빙"
    router_session_scope: "per_thread"
    router_handler: "agent_hub.router_handlers.cheongchangsa:run_manual_qa"
    self_consistency: false
    self_consistency_n: 3
    router_description: "청창사(청년창업사관학교) 사업비 집행·증빙 규정, 필요 서류/요건, 집행 방법에 대한 '질문'에 매뉴얼(RAG) 근거로 답변. 파일 없이 텍스트로 묻는 경우. 예: '인건비 증빙 뭐 필요해?', '광고비 어떻게 집행해?', '해외 결제 증빙은?'"
artifacts:
  markdown_title: "청창사 증빙 검토본"
  html_artifact_title: "청창사 증빙 검토본.html"
  markdown_artifact_title: "청창사 증빙 검토본.md"
