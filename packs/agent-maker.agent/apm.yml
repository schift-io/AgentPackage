name: schift-agent-maker
display_name: "Schift Agent Maker"
version: 0.1.0
description: >-
  요구사항을 실행 가능한 팩 정의(apm.yml + agent.md + SKILL.md)로 옮기는 에이전트.
  **발행하지 않는다** — 초안까지가 범위이고 검토·발행은 사람이 결정한다.
  중복 팩 생성을 막기 위해 만들기 전에 카탈로그를 먼저 확인한다.

pipeline: react
access_scope: org

visibility: public
owner_org: org_room821

agents:
  - id: schift/agent-maker.agent/agent.md
    path: apm/agent-maker.agent/agent.md

skills:
  - id: schift/skills/pack-authoring
    path: apm/agent-maker.agent/skills/pack-authoring/SKILL.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

# 카탈로그 조회가 이 팩의 핵심 도구다 — 중복 생성을 막는 유일한 수단.
tools:
  - name: rag_search
    description: "조직 지식 검색. 기존 팩·업무 규칙을 확인할 때."
  - name: web_search
    description: "웹 검색. 외부 사례·형식을 참고할 때만."

hub:
  label: "Agent Maker"
  role: "요구사항을 팩 정의 초안으로 옮긴다"
  inputs:
    - "만들고 싶은 에이전트 설명"
  output: "팩 정의 초안(apm.yml · agent.md · SKILL.md)"
