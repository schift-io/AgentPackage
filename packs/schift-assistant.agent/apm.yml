name: schift-assistant-agent
version: 0.1.0
kind: chat
description: >
  회사 업무 비서 — 자연어로 말하면 RAG로 답하거나 CRM 도구(할일/활동/오늘 업무)를
  호출하는 ReAct 에이전트. 모델은 inference policy(room821→A3B), 과금은 agent-run 경로.
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True, sub_agent_plan=[])과 바이트 동일.
pipeline: react
# text_model — 선언 기반 모델 라우팅(main.py:_run_agentic_session_gated). 안정적
# tool-calling을 위해 OpenAI 직결로 오버라이드(A3B는 vLLM tool-call-parser
# 미설정이라 tool_calls=0, 라이브 확정). agent_hub.agent_packs.SCHIFT_ASSISTANT_PACK
# 의 동일 필드와 값이 일치해야 한다(수동 미러 — bid-response.agent 패턴과 동일).
text_model:
  default: openai/gpt-5.4-mini
  model_env: ASSISTANT_BOT_MODEL
agents:
  - id: schift/schift-assistant.agent/agent.md
    path: apm/schift-assistant.agent/agent.md

skills:
  - id: room821/skills/schift-memory
    runtime: schift-memory
