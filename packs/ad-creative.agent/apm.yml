name: room821-ad-creative-agent
display_name: "Room821 Ad Creative Agent"
version: 0.1.3
description: >-
  AI 광고 크리에이티브 APM. Ogilvy DO BRIEF(구조화 intake) → 세그먼트 팬아웃 →
  캐릭터 시트(JSON+레퍼런스 앵커) → 스토리보드(grid 초안 → 승인 컷 업스케일).
  브랜드 버킷 RAG grounding, 모델-무관 이미지 어댑터(디폴트 저가·고속).
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한, 실행은 allowed_orgs 가 별도 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: public
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True, sub_agent_plan=[])과 바이트 동일.
pipeline: react
access_scope: org  # owner_org_id=org_room821

agents:
  - id: room821/ad-creative.agent/agent.md
    path: apm/ad-creative.agent/agent.md

skills:
  - id: room821/skills/ogilvy-brief
    path: apm/ad-creative.agent/skills/ogilvy-brief/SKILL.md
    references:
      - apm/ad-creative.agent/skills/ogilvy-brief/references/ogilvy-brief-schema.json
      - apm/ad-creative.agent/skills/ogilvy-brief/references/six-element-ontology.md
  - id: room821/skills/segment-fanout
    path: apm/ad-creative.agent/skills/segment-fanout/SKILL.md
    references:
      - apm/ad-creative.agent/skills/segment-fanout/references/segment-axes.md
  - id: room821/skills/character-sheet
    path: apm/ad-creative.agent/skills/character-sheet/SKILL.md
  - id: room821/skills/storyboard-designer
    path: apm/ad-creative.agent/skills/storyboard-designer/SKILL.md
    references:
      - apm/ad-creative.agent/skills/storyboard-designer/references/shot-grammar.md
      - apm/ad-creative.agent/skills/storyboard-designer/references/anti-slop-prompt-rules.md
  - id: room821/skills/ad-qc
    path: apm/ad-creative.agent/skills/ad-qc/SKILL.md
    references:
      - apm/ad-creative.agent/skills/ad-qc/references/scorecard-17.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

awp_operations:
  - id: ad-storyboard
    contract_version: awp.ad_creative.storyboard.v1
    purpose: >-
      Ogilvy 브리프 + 선택된 세그먼트로 승인 가능한 광고 스토리보드 패킷을 만든다.
      비용/일관성 최적화를 위해 초안은 grid 1장으로 뽑고, 승인된 컷만 개별 고해상 재생성한다.
    approval_required: true
    host_route: /v1/agents/ad-creative/operations/ad-storyboard/runs
    image_model:
      # 디폴트는 저가·고속. 품질 컷만 업그레이드. 실제 엔드포인트는 어댑터 env로 주입.
      default: grok-imagine          # ~$0.020/1k img
      quality_upgrade: nano-banana   # 승인 컷 per-panel 업스케일
      cheapest_alt: flux-2-klein-9b  # ~$0.015/1k img
      adapter_env: AD_CREATIVE_IMAGE_ADAPTER_URL
      draft_mode: grid               # 8~12 패널을 1회 생성(단일 forward pass=최대 일관성+최저 비용)
      per_image_token_estimate: 1120

runtime_boundary:
  apm_owns:
    - user_intent_routing
    - awp_selection
    - approval_summary
    - ambiguity_resolution
    - segment_axis_choice
  awp_owns:
    - ogilvy_brief_schema
    - segment_persona_derivation
    - character_sheet_anchors
    - storyboard_scene_schema
    - grid_draft_composition
    - consistency_score_gate
    - usage_metering_events
  host_services_only:
    - auth
    - brand_bucket_rag
    - image_generation_connector
    - image_upscale_connector
    - vision_scorer
    - usage_ledger
    - run_persistence
  forbidden_host_policy:
    - brief_field_rewrite_prompt
    - segment_definition_decision
    - anchor_text_policy
    - shot_grammar_policy
    - billing_metering_policy

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
document_hierarchy:
  template_id: "room821_ad_creative_v1"
  title: "광고 스토리보드 패킷"
  kind: "document"
  knowledge:
    retrieval_required: false
    source_strategy: "brand_bucket_rag"
  sections:
    - id: "1"
      title: "Ogilvy 브리프"
      prompt: "Ogilvy DO BRIEF 11필드를 브랜드 버킷/사용자 입력에서 채운다. 모르는 값은 지어내지 말고 'MISSING — ask'로 표시해 ≤3개 질문으로 묶어 묻는다. 6요소(Hook·Pain·Value·Offer·Urgency·CTA) 커버리지를 생성 전에 검증한다."
    - id: "2"
      title: "세그먼트"
      prompt: "브리프의 타깃을 5축 중 하나로 2~4개 세그먼트로 나눈다. 세그먼트마다 감정 드라이버·실제 어투·동기·장벽·소통 선호를 파생한다. 인구통계가 아니라 감정으로 차별화한다."
    - id: "3"
      title: "캐릭터 시트"
      prompt: "세그먼트당 캐릭터를 JSON identity 시트 + 히어로 레퍼런스 + face-ref로 고정한다. 제품이 노출되면 제품 앵커(로고·패키징·색)도 고정한다."
    - id: "4"
      title: "스토리보드 (grid 초안)"
      prompt: "MEGA-ANCHOR 레시피로 매 컷 프롬프트 앞에 [환경][캐릭터][의상][제품] 앵커를 concat한다. 초안은 grid 1장으로 뽑는다. 승인 전에는 컷마다 개별 생성하지 않는다."
    - id: "5"
      title: "QC / 사람 확인"
      prompt: "17점 스코어카드 + vision 일관성 스코어러로 채점하고, 미달 컷만 앵커를 보정해 재생성한다. 이미지 생성·업스케일·render 확정 전 세그먼트·컷 수·예상 원가를 사람이 승인한다."
artifacts:
  markdown_title: "광고 스토리보드 검토본"
  html_artifact_title: "광고 스토리보드 검토본.html"
  markdown_artifact_title: "광고 스토리보드 검토본.md"
  visual_assets_enabled: true
