name: schift-email-assistant-agent
version: 0.1.3
description: >-
  Schift email assistant (베타). Classifies an incoming Gmail thread
  (skip / draft_reply / escalate) and, for relevant mail, drafts a
  knowledge-grounded reply into the user's drafts folder for review. Never sends.
  RAG runs against the org's configured knowledge bucket; the reply signature is
  taken from the user's Gmail sendAs settings.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: private
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True, sub_agent_plan=[])과 바이트 동일.
pipeline: react

agents:
  - id: schift/email-assistant.agent/agent.md
    path: apm/email-assistant.agent/agent.md

skills:
  - id: schift/skills/email-triage
    path: apm/email-assistant.agent/skills/email-triage/SKILL.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

# 트리거: published gmail_trigger 워크플로(workflow-email-trigger-cron)가 새 메일을
# hydrate해서 이 팩을 1회 실행한다(news-monitor와 동일한 cron→run 경로).
delivery:
  mode: api_digest
  cron_via: gmail_trigger

knowledge:
  # 버킷은 org가 지정한 knowledge bucket을 런타임에 주입(document_hierarchy.knowledge.
  # bucket_id). 하드코딩하지 않는다. 버킷 미지정 시 rag_search 없이 일반 초안만.
  retrieval_required: false
