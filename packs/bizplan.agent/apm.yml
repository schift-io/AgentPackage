name: room821-bizplan-agent
display_name: "Business Plan Agent"
version: 0.2.2
description: Room821 business-plan (수행계획서) agent package.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한, 실행은 allowed_orgs 가 별도 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: public
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=False)과 바이트 동일.
pipeline: fanout
access_scope: org  # owner_org_id=org_room821

# memory 계약 — hub_inputs가 약속한 "회사 메모리가 자동 반영"이 실제로 일어나려면
# memory.* 툴이 fan-out in-loop 근거수집에 바인딩돼야 한다(bid-response와 동일 패턴,
# 2026-07-11 pack-wiring-audit 갭 ①. agent_packs.py BIZPLAN_PACK과 수동 미러).
memory:
  requires:
    tools: [memory.search, memory.recall, memory.cite]
    scopes: [core, agent]

agents:
  - id: room821/bizplan.agent/agent.md
    path: apm/bizplan.agent/agent.md

skills:
  - id: room821/skills/submission-writer
    path: apm/bizplan.agent/skills/submission-writer/SKILL.md
  - id: room821/skills/lightocr-parser
    runtime: schift-ocr
  - id: room821/skills/schift-memory
    runtime: schift-memory
  - id: room821/skills/bizplan-reviewer
    runtime: agent-hub

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
customizable: true
document_hierarchy:
  template_id: "schift_bizplan_psst_v1"
  title: "사업계획서"
  kind: "document"
  research_queries: []
  required_sections:
    - "1"
    - "2"
    - "3"
    - "4"
  input_contract:
    required:
      - "notice_outline"
      - "evaluation_criteria"
      - "organization_profile"
      - "source_forms"
    optional:
      - "budget_constraints"
      - "schedule"
      - "supporting_evidence"
  sections:
    - id: "1"
      title: "문제인식 (Problem)"
      prompt: "공고와 제공 자료에 근거해 해결해야 할 문제와 추진 배경을 작성한다."
    - id: "2"
      title: "해결방안 (Solution)"
      prompt: "제안하는 해결방안, 구현 방법, 차별점과 검증 방법을 작성한다."
    - id: "3"
      title: "성장전략 (Scale)"
      prompt: "실행계획, 시장·사업화 전략, 예산·일정과 기대효과를 작성한다."
    - id: "4"
      title: "팀구성 (Team)"
      prompt: "조직, 역할, 역량, 협력 구조와 사업 수행 책임을 작성한다."
non_runnable_agent_ids:
  - "chart-visual-asset-agent"
  - "proposal-review-agent"
qc_enabled: true
sub_agent_plan:
  - id: "bizplan-writer-1-agent"
    name: "Writer 1 Agent"
    owns_sections:
      - "1"
      - "2"
    purpose: "문제인식 (Problem) · 해결방안 (Solution) 섹션을 공고·양식과 제공된 근거에 맞춰 작성한다."
    required_memory:
      - "document_hierarchy"
      - "source_documents"
    output: "sections_1_2"
    generation:
      max_tokens: 4096
      temperature: 0.3
      timeout_seconds: 240
  - id: "bizplan-writer-2-agent"
    name: "Writer 2 Agent"
    owns_sections:
      - "3"
      - "4"
    purpose: "성장전략 (Scale) · 팀구성 (Team) 섹션을 공고·양식과 제공된 근거에 맞춰 작성한다."
    required_memory:
      - "document_hierarchy"
      - "source_documents"
    output: "sections_3_4"
    generation:
      max_tokens: 4096
      temperature: 0.3
      timeout_seconds: 240
  - id: "proposal-review-agent"
    name: "Proposal Review Agent"
    owns_sections:
      - "1"
      - "2"
      - "3"
      - "4"
    purpose: "전체 섹션의 양식 준수, 근거 연결, 수치와 제출 가능 여부를 검토한다."
    required_memory:
      - "all_section_drafts"
      - "document_hierarchy"
    output: "review_findings_and_final_patch"
    generation:
      max_tokens: 4096
      temperature: 0.1
      timeout_seconds: 240
artifacts:
  markdown_title: "사업계획서 제출 검토본"
  html_artifact_title: "사업계획서 제출 검토본.html"
  include_required_tables: true
  markdown_artifact_title: "사업계획서 제출 검토본.md"
  visual_assets_enabled: true
