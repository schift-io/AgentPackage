name: schift-meeting-processing-agent
version: 0.1.2
description: Schift meeting processing APM that selects meeting-note AWPs and coordinates user approval.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한, 실행은 allowed_orgs 가 별도 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: public
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=False, sub_agent_plan=[])과 바이트 동일.
pipeline: fanout

agents:
  - id: schift/meeting-processing.agent/agent.md
    path: apm/meeting-processing.agent/agent.md

skills:
  - id: schift/skills/meeting-action-review
    path: apm/meeting-processing.agent/skills/meeting-action-review/SKILL.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

awp_operations:
  - id: meeting-note-to-action-suggestions
    contract_version: awp.meeting_action_suggestion.v1
    purpose: Extract reminder and email alert candidates from a meeting note.
    approval_required: true
    host_route: /v1/meetings/{meeting_id}/action-proposal-runs
  - id: meeting-note-qa
    contract_version: awp.meeting_qa.v1
    purpose: Answer meeting/project questions with grounded RAG retrieval and citations.
    approval_required: false
    host_route: /v1/meetings/chat
  - id: meeting-note-to-followup-email
    contract_version: awp.meeting_followup_email.v1
    purpose: Draft follow-up email candidates after a meeting.
    approval_required: true
    status: planned
  - id: meeting-note-to-decisions
    contract_version: awp.meeting_decision_extraction.v1
    purpose: Extract grounded decisions and unresolved questions.
    approval_required: true
    status: planned
  - id: meeting-note-to-knowledge-memory
    contract_version: awp.meeting_knowledge_memory.v1
    purpose: Promote approved meeting knowledge into organization memory.
    approval_required: true
    status: planned

runtime_boundary:
  apm_owns:
    - user_intent_routing
    - awp_selection
    - approval_summary
    - ambiguity_resolution
    - connector_failure_recovery
  awp_owns:
    - extraction_policy
    - structured_output_schema
    - evidence_grounding_rules
    - approval_checkpoint
    - destination_contract
  host_services_only:
    - auth
    - note_storage
    - run_persistence
    - connector_handoff
  forbidden_host_policy:
    - meeting_action_extraction_prompt
    - reminder_destination_decision
    - email_alert_policy
    - knowledge_promotion_policy
