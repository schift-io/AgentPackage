name: schift-hr-attendance-agent
display_name: "Schift HR/Attendance Agent"
version: 0.1.3
description: >
  Schift HR/근태 APM. 직원의 휴가·근태 신청을 규제 Agent(법률·회칙)와
  인사 Agent(조직 운영)가 병렬 검토하여 승인/반려/보완 판정을 내리고,
  Schift approval 시스템과 연결한다.
extends: ../runtime.yml

# 레지스트리 ref ACL — 미선언이면 서버 기본 private + owner 없음이라
# 어떤 org 도 목록에서 못 본다(2026-07-20 실측: 라이브 ref 25개 전부 그 상태).
# visibility=발견 권한. corporate 는 '인증된 아무 org'를 뜻하므로
# (apm_ref_visible: corporate -> bool(org_id)) 우리 전용 팩에는 부적합하다.
# private 은 owner_org + allowed_orgs 만 본다. 실행도 그 둘이 게이트한다
# (apm_ref_visible / apm_ref_executable 분리) — public 이어도 실행은 계약 org 만.
visibility: private
owner_org: org_room821
# telegram-agent-router-orchestrator.md §5 Phase 0 — 선언적 pipeline(무동작 변경).
# 값은 agentic_run_service.execute_agentic_run의 오늘 추론(has_tools=True지만 runnable
# sub-agent도 있어 fan-out 유지, in-loop 툴 근거수집 W2b)과 바이트 동일.
pipeline: fanout

agents:
  - id: schift/hr-attendance.agent/agent.md
    path: apm/hr-attendance.agent/agent.md

skills:
  - id: schift/skills/hr-leave-intake
    path: apm/hr-attendance.agent/skills/leave-intake/SKILL.md
  - id: schift/skills/hr-regulation-review
    path: apm/hr-attendance.agent/skills/regulation-review/SKILL.md
    references:
      - apm/hr-attendance.agent/skills/regulation-review/references/kr-labor-law-checklist.md
  - id: schift/skills/hr-hrops-review
    path: apm/hr-attendance.agent/skills/hrops-review/SKILL.md
    references:
      - apm/hr-attendance.agent/skills/hrops-review/references/leave-request-schema.md
      - apm/hr-attendance.agent/skills/hrops-review/references/approval-rules.md
  - id: schift/skills/hr-approval-dispatch
    path: apm/hr-attendance.agent/skills/approval-dispatch/SKILL.md
    references:
      - apm/hr-attendance.agent/skills/approval-dispatch/references/approval-rules.md
  - id: room821/skills/schift-memory
    runtime: schift-memory

knowledge:
  - bucket_id: "kr-labor-law-reference"
    bucket_name: kr-labor-law-reference
    bucket_role: regulation_reference
    retrieval_required: true
    scope: read_only
  - bucket_id: "{SCHIFT_COMPANY_RAG_BUCKET}"
    bucket_name: default
    bucket_role: company_hr_policy
    retrieval_required: true
    scope: read_only

surface:
  kind: internal_hr_assistant
  edge_owner: schift-api
  edge_endpoint: /v1/hr/leave-requests
  recommended_inference_mode: public_router

tool_policy:
  allowed:
    - schift-rag.retrieve
    - schift.memory.append
    - schift.memory.flush
    - schift.memory.retrieve
    - agent_hub.hooks.emit
    - agent_hub.cost.log
    - hr.regulation_search
    - hr.company_policy_search
    - hr.employee_leave_balance
    - hr.team_leave_calendar
    - hr.org_chart_lookup
    - hr.create_approval_request
    - hr.notify_user
  blocked_by_default:
    - external_web_search
    - arbitrary_filesystem_crawl
    - payroll_amount_calculation
    - legal_final_judgement

# agent_packs.py 에서 이관 — 값은 코드 매니페스트와 바이트 동일(왕복 검증됨).
document_hierarchy:
  template_id: "schift_hr_attendance_leave_approval_v1"
  title: "HR/근태"
  kind: "document"
  channel:
    type: "multi"
    install_mode: "per_tenant_oauth"
    providers:
      - "discord"
      - "slack"
      - "telegram"
    commands:
      - name: "leave"
        ko_name: "휴가"
        awp_operation: "hr_attendance.leave_request"
      - name: "status"
        ko_name: "휴가-상태"
        awp_operation: "hr_attendance.leave_status"
      - name: "supplement"
        ko_name: "휴가-보완"
        awp_operation: "hr_attendance.leave_supplement"
  knowledge:
    bucket_id: "kr-labor-law-reference"
    bucket_role: "regulation_reference"
    retrieval_required: true
  sections:
    - id: "1"
      title: "접수 요약"
      prompt: "신청자, 휴가 유형, 기간, 일수, 사유를 간단히 정리합니다."
    - id: "2"
      title: "규제 Agent 검토"
      prompt: "근로기준법·회칙 검토 결과와 위반 가능성을 요약합니다."
    - id: "3"
      title: "인사 Agent 검토"
      prompt: "팀 커버리지, 결재선, 잔여 연차 등 조직 운영 검토를 요약합니다."
    - id: "4"
      title: "사람 확인이 필요한 항목"
      prompt: "Agent가 확정하지 못하거나 사람이 반드시 확인해야 할 항목을 나열합니다."
qc_enabled: true
sub_agent_plan:
  - id: "leave-intake"
    name: "신청 정규화"
    label: "신청 정규화"
    owns_sections:
      - "1"
    runnable: true
  - id: "regulation-review"
    name: "규제 검토"
    label: "규제 검토"
    owns_sections:
      - "2"
    runnable: true
  - id: "hr-hrops-review"
    name: "인사 검토"
    label: "인사 검토"
    owns_sections:
      - "3"
    runnable: true
  - id: "approval-dispatch"
    name: "결정 합성"
    label: "결정 합성"
    owns_sections:
      - "4"
    runnable: true
artifacts:
  markdown_title: "HR/근태 검토 리포트"
  html_artifact_title: "hr_attendance_review.html"
  markdown_artifact_title: "hr_attendance_review.md"
